<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard — Ragetech Collective</title>
  <meta name="description" content="Central administration console for dynamic projects, landing page showcases, and team developer management.">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%2309090b'/><path d='M13 3L4 16h10l-1 13 15-17h-11l1-9z' fill='%2306b6d4'/></svg>">
  <link rel="stylesheet" href="styles.css">
  <style>
    .avatar-preset-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 2px solid var(--border-subtle);
      cursor: pointer;
      overflow: hidden;
      transition: all var(--transition-fast);
      padding: 0;
      background: none;
    }
    .avatar-preset-btn:hover {
      border-color: var(--accent-cyan);
      transform: scale(1.1);
    }
    .project-toggle-card {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 12px;
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      background: rgba(255, 255, 255, 0.02);
      cursor: pointer;
      transition: all var(--transition-fast);
      user-select: none;
    }
    .project-toggle-card:hover {
      border-color: rgba(6, 182, 212, 0.4);
      background: rgba(6, 182, 212, 0.05);
    }
    .project-toggle-card.selected {
      border-color: var(--accent-cyan);
      background: rgba(6, 182, 212, 0.12);
    }
    .project-toggle-checkbox {
      accent-color: var(--accent-cyan);
      width: 16px;
      height: 16px;
      cursor: pointer;
    }
    .feature-hint-card {
      background: linear-gradient(135deg, rgba(6, 182, 212, 0.08) 0%, rgba(139, 92, 246, 0.05) 100%);
      border: 1px solid rgba(6, 182, 212, 0.2);
      border-radius: var(--radius-md);
      padding: 16px 20px;
      margin-bottom: 24px;
      display: flex;
      align-items: flex-start;
      gap: 14px;
    }
    .feature-hint-card p {
      margin: 4px 0 0;
      font-size: 0.84rem;
      color: var(--text-secondary);
      line-height: 1.5;
    }
  </style>
</head>
<body class="dashboard-page">

  <div class="ambient-mesh-glow" aria-hidden="true"></div>
  <div class="bg-dot-grid" aria-hidden="true"></div>

  <!-- Top Navigation Header -->
  <header class="site-header">
    <div class="header-glass-bar">
      <div class="brand-wrapper">
        <a href="index.html" class="brand-mark" aria-label="Ragetech Home">
          <div class="brand-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
          </div>
          <span class="brand-name">RAGETECH</span>
        </a>
        <span class="badge-role admin">ADMIN DASHBOARD</span>
      </div>

      <div class="header-actions">
        <a href="index.html" class="btn-secondary" style="font-size: 0.82rem; padding: 6px 14px;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
          <span>View Public Site</span>
        </a>
        <button onclick="handleLogout()" class="btn-secondary" style="font-size: 0.82rem; padding: 6px 14px; color: #f87171; border-color: rgba(239,68,68,0.25);">
          <span>Sign Out</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Dashboard Layout -->
  <div class="dashboard-layout">
    <!-- Sidebar -->
    <aside class="dashboard-sidebar">
      <div class="dashboard-user-card" id="adminUserCard">
        <img src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=280&q=80" alt="Admin" class="dashboard-user-avatar" id="adminAvatar">
        <div style="flex: 1; min-width: 0;">
          <div style="font-weight: 700; font-size: 0.92rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;" id="adminName">Reymart Chua</div>
          <div style="font-family: var(--font-mono); font-size: 0.74rem; color: var(--accent-cyan);" id="adminEmail">reymartchua@ragetech.dev</div>
        </div>
      </div>

      <nav class="dashboard-nav-menu">
        <div class="dash-nav-item active" data-view="repos" onclick="switchView('repos')">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
          <span>Projects & Showcase</span>
        </div>
        <div class="dash-nav-item" data-view="builders" onclick="switchView('builders')">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
          <span>Team & Developers</span>
        </div>
        <div class="dash-nav-item" data-view="assignments" onclick="switchView('assignments')">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 11 12 14 22 4"></polyline><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path></svg>
          <span>Project Assignments</span>
        </div>
        <div class="dash-nav-item" data-view="audit" onclick="switchView('audit')">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 14 14"></polyline></svg>
          <span>Activity & Database Log</span>
        </div>
        <div class="dash-nav-item" data-view="security" onclick="switchView('security')">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
          <span>Security & Access Key</span>
        </div>
      </nav>

      <div style="margin-top: auto; padding-top: 20px; border-top: 1px solid var(--border-subtle); font-family: var(--font-mono); font-size: 0.74rem; color: var(--text-muted);">
        <div>Database: Cloudflare D1</div>
        <div style="color: var(--accent-emerald); margin-top: 4px;">● Live Dynamic Synchronization</div>
      </div>
    </aside>

    <!-- Main Workspace -->
    <main class="dashboard-main" id="dashMain">
      <!-- Rendered dynamically -->
    </main>
  </div>

  <!-- Dynamic Modal for Adding / Editing Developers -->
  <div id="crudModal" class="modal-backdrop" aria-hidden="true">
    <div class="modal-dialog" style="max-width: 680px; max-height: 90vh; overflow-y: auto;">
      <button class="modal-close-btn" onclick="closeCrudModal()" aria-label="Close modal">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      </button>
      <div id="crudModalContent"></div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="api-bridge.js?v=20261012-d1"></script>
  <script>
    let currentView = 'repos';
    let projectsData = [];
    let developersData = [];

    // Session Verification
    function checkAdminSession() {
      const saved = localStorage.getItem('ragetech_session');
      if (!saved) {
        window.location.href = 'index.html';
        return null;
      }
      try {
        const parsed = JSON.parse(saved);
        if (parsed.user.account_role !== 'admin') {
          if (parsed.user.account_role === 'lead') {
            window.location.href = 'lead.html';
          } else {
            window.location.href = 'developer-studio.html';
          }
          return null;
        }
        document.getElementById('adminName').textContent = parsed.user.name;
        document.getElementById('adminEmail').textContent = parsed.user.email || `@${parsed.user.handle}`;
        if (parsed.user.avatar_url) document.getElementById('adminAvatar').src = parsed.user.avatar_url;
        return parsed.user;
      } catch (e) {
        window.location.href = 'index.html';
        return null;
      }
    }

    function handleLogout() {
      localStorage.removeItem('ragetech_session');
      window.location.href = 'index.html';
    }

    // Dynamic Data Loader (Direct Cloudflare D1 Database)
    async function loadData() {
      let d1Projects = [];
      let d1Devs = [];

      try {
        const pRes = await fetch('/api/projects');
        if (pRes.ok) {
          const json = await pRes.json();
          if (Array.isArray(json.data)) d1Projects = json.data;
        }
      } catch (e) {
        console.warn('Error fetching /api/projects:', e);
      }

      try {
        const dRes = await fetch('/api/developers');
        if (dRes.ok) {
          const json = await dRes.json();
          if (Array.isArray(json.data)) d1Devs = json.data;
        }
      } catch (e) {
        console.warn('Error fetching /api/developers:', e);
      }

      projectsData = d1Projects;
      developersData = d1Devs;
      renderCurrentView();
    }

    function switchView(view) {
      currentView = view;
      document.querySelectorAll('.dash-nav-item').forEach(el => {
        el.classList.toggle('active', el.getAttribute('data-view') === view);
      });
      renderCurrentView();
    }

    function renderCurrentView() {
      const main = document.getElementById('dashMain');
      if (!main) return;

      if (currentView === 'repos') {
        main.innerHTML = `
          <div class="dash-header-row">
            <div>
              <h1 class="dash-title">Projects & Landing Page Showcase</h1>
              <p class="dash-subtitle">Manage repositories, customize landing page metrics & code terminal, and edit technical whitepapers.</p>
            </div>
            <a href="repository_editor.html" class="btn-primary">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
              <span>+ Create New Project</span>
            </a>
          </div>

          <!-- Feature Guidance Banner -->
          <div class="feature-hint-card">
            <div style="font-size: 1.4rem;">✨</div>
            <div>
              <strong style="color: var(--text-primary); font-size: 0.92rem;">Dual-Layer Visual Customization:</strong>
              <p>Every repository has two editable areas: <strong>(1) The Landing Page Showcase</strong> (repo tag, version badge, architectural metrics table, and interactive code preview terminal), and <strong>(2) The Dedicated Dossier Page</strong> (<code>project.html</code> whitepaper, custom action button, and maintainer team). Click <strong>Customize</strong> on any project to edit both with live preview!</p>
            </div>
          </div>

          <div class="data-table-container">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Project Name & Path</th>
                  <th>Version Badge</th>
                  <th>Category</th>
                  <th>Assigned Maintainers</th>
                  <th>Status</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody>
                ${projectsData.length === 0 ? `
                  <tr>
                    <td colspan="6" style="text-align: center; padding: 48px 16px; color: var(--text-muted);">
                      <div style="font-size: 1.05rem; font-weight: 600; color: var(--text-secondary); margin-bottom: 6px;">No Projects Registered</div>
                      <div style="font-size: 0.85rem;">Currently 0 repositories exist in Cloudflare D1. Click <strong>+ Create New Project</strong> to publish a new repository.</div>
                    </td>
                  </tr>
                ` : projectsData.map(p => {
                  const maintainers = p.assignees || p.maintainer_handles || (p.maintainers ? p.maintainers.map(m => m.handle) : []);
                  return `
                    <tr>
                      <td>
                        <div style="font-weight: 700; font-size: 0.95rem;">${p.name}</div>
                        <div style="font-family: var(--font-mono); font-size: 0.74rem; color: var(--accent-cyan); margin-top: 2px;">${p.repo || `ragetech/${p.slug}`}</div>
                        <div style="font-size: 0.78rem; color: var(--text-muted); margin-top: 2px;">${p.tagline || ''}</div>
                      </td>
                      <td><span class="stack-pill" style="font-size: 0.72rem; padding: 2px 8px;">${p.badge || 'v0.9.4'}</span></td>
                      <td><span class="stack-pill" style="color: var(--accent-cyan); border-color: rgba(6,182,212,0.3); font-size: 0.75rem;">${p.category || 'Project'}</span></td>
                      <td>
                        <div style="display: flex; gap: 4px; flex-wrap: wrap;">
                          ${maintainers.length > 0 
                            ? maintainers.map(h => `<span class="stack-pill" style="font-size: 0.68rem; padding: 2px 6px;">@${h}</span>`).join('') 
                            : '<span style="font-size: 0.72rem; color: var(--text-muted);">None</span>'}
                        </div>
                      </td>
                      <td><span class="verified-icon-chip" style="font-size: 0.72rem;">${(p.status || 'ACTIVE').toUpperCase()}</span></td>
                      <td>
                        <div class="table-actions">
                          <a href="repository_editor.html?id=${p.slug}" class="btn-primary" style="font-size: 0.76rem; padding: 5px 12px; text-decoration: none;" title="Open Visual Customizer">
                            Customize
                          </a>
                          <a href="project.html?id=${p.slug}" target="_blank" class="btn-secondary" style="font-size: 0.76rem; padding: 5px 10px; text-decoration: none;">
                            View Page
                          </a>
                          <button class="btn-icon-action danger" onclick="deleteProject('${p.id || p.slug}')" title="Delete Repository">
                            Delete
                          </button>
                        </div>
                      </td>
                    </tr>
                  `;
                }).join('')}
              </tbody>
            </table>
          </div>
        `;
      } else if (currentView === 'builders') {
        main.innerHTML = `
          <div class="dash-header-row">
            <div>
              <h1 class="dash-title">Team & Developers Directory</h1>
              <p class="dash-subtitle">Create, customize, and manage developer profiles, engineering job titles, bios, profile links, and assigned repositories.</p>
            </div>
            <button class="btn-primary" onclick="openDeveloperModal()">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
              <span>+ Add New Developer</span>
            </button>
          </div>

          <div class="data-table-container">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Developer Profile</th>
                  <th>Engineering Title</th>
                  <th>Assigned Repositories</th>
                  <th>Permission Level</th>
                  <th>Verified</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody>
                ${developersData.map(d => `
                  <tr>
                    <td>
                      <div style="display: flex; align-items: center; gap: 12px;">
                        <img src="${d.avatar_url}" style="width: 36px; height: 36px; border-radius: 50%; object-fit: cover; border: 1px solid var(--border-subtle);" alt="${d.name}">
                        <div>
                          <div style="font-weight: 700; font-size: 0.92rem;">${d.name}</div>
                          <div style="font-family: var(--font-mono); font-size: 0.74rem; color: var(--accent-cyan);">@${d.handle}</div>
                          <div style="font-size: 0.72rem; color: var(--text-muted);">${d.email || 'No email set'}</div>
                        </div>
                      </div>
                    </td>
                    <td>
                      <div style="font-weight: 600; font-size: 0.86rem;">${d.role}</div>
                      <div style="font-size: 0.74rem; color: var(--text-muted); max-width: 240px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${d.bio || ''}</div>
                    </td>
                    <td>
                      <div style="display: flex; gap: 4px; flex-wrap: wrap;">
                        ${(d.assigned_projects && d.assigned_projects.length > 0)
                          ? d.assigned_projects.map(slug => `<span class="stack-pill" style="font-size: 0.68rem; padding: 2px 7px; color: var(--accent-cyan); border-color: rgba(6,182,212,0.3);">${slug}</span>`).join('')
                          : '<span style="font-size: 0.72rem; color: var(--text-muted);">Core Platform</span>'}
                      </div>
                    </td>
                    <td>
                      <span class="badge-role ${d.account_role || 'developer'}">
                        ${(d.account_role === 'admin' ? 'Administrator' : (d.account_role === 'lead' ? 'Project Lead' : 'Developer')).toUpperCase()}
                      </span>
                    </td>
                    <td>
                      ${d.is_verified 
                        ? '<span style="color: var(--accent-emerald); font-weight: 600; font-size: 0.8rem; display: flex; align-items: center; gap: 4px;">✓ Verified</span>' 
                        : '<span style="color: var(--text-muted); font-size: 0.8rem;">Standard</span>'}
                    </td>
                    <td>
                      <div class="table-actions">
                        <button class="btn-primary" style="font-size: 0.76rem; padding: 5px 12px;" onclick="openDeveloperModal('${d.handle}')">Edit Profile</button>
                        <button class="btn-secondary" style="font-size: 0.76rem; padding: 5px 10px;" onclick="openQuickPasswordModal('${d.handle}')" title="Reset Developer Access Key">Change Key</button>
                        <a href="developer.html?id=${d.handle}" target="_blank" class="btn-secondary" style="font-size: 0.76rem; padding: 5px 10px; text-decoration: none;">View Dossier</a>
                        <button class="btn-icon-action danger" onclick="deleteDeveloper('${d.id || d.handle}')" title="Remove Developer">Remove</button>
                      </div>
                    </td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        `;
      } else if (currentView === 'assignments') {
        main.innerHTML = `
          <div class="dash-header-row">
            <div>
              <h1 class="dash-title">Maintainer Team Assignments</h1>
              <p class="dash-subtitle">Easily assign developers to maintain repositories and sign release whitepapers.</p>
            </div>
            <button class="btn-primary" onclick="openAssignmentModal()">
              <span>+ Assign Developer</span>
            </button>
          </div>

          <div class="data-table-container">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Repository</th>
                  <th>Category</th>
                  <th>Current Maintainers</th>
                  <th>Action</th>
                </tr>
              </thead>
              <tbody>
                ${projectsData.map(p => {
                  const handles = p.assignees || p.maintainer_handles || (p.maintainers ? p.maintainers.map(m => m.handle) : []);
                  return `
                    <tr>
                      <td>
                        <div style="font-weight: 700;">${p.name}</div>
                        <div style="font-family: var(--font-mono); font-size: 0.74rem; color: var(--accent-cyan);">${p.repo || `ragetech/${p.slug}`}</div>
                      </td>
                      <td><span class="stack-pill" style="color: var(--accent-cyan); border-color: rgba(6,182,212,0.3); font-size: 0.75rem;">${p.category || 'Project'}</span></td>
                      <td>
                        <div style="display: flex; gap: 6px; flex-wrap: wrap;">
                          ${handles.length > 0 
                            ? handles.map(h => `<span class="stack-pill">@${h}</span>`).join('')
                            : '<span style="font-size: 0.76rem; color: var(--text-muted);">None</span>'}
                        </div>
                      </td>
                      <td>
                        <a href="repository_editor.html?id=${p.slug}#step-maintainers" class="btn-secondary" style="font-size: 0.76rem; padding: 5px 12px; text-decoration: none;">
                          Manage Team in Studio
                        </a>
                      </td>
                    </tr>
                  `;
                }).join('')}
              </tbody>
            </table>
          </div>
        `;
      } else if (currentView === 'audit') {
        main.innerHTML = `
          <div class="dash-header-row">
            <div>
              <h1 class="dash-title">Activity & Database Log</h1>
              <p class="dash-subtitle">Live log of administrative authorizations, updates, and Cloudflare D1 edge synchronizations.</p>
            </div>
          </div>

          <div class="data-table-container">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Timestamp (UTC)</th>
                  <th>Event</th>
                  <th>Scope</th>
                  <th>Target</th>
                  <th>Description</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td><code>2026-10-12 12:10:00</code></td>
                  <td><span class="stack-pill" style="color: #34d399; border-color: rgba(52,211,153,0.3); font-size: 0.72rem;">D1 SYNC</span></td>
                  <td>Edge DB</td>
                  <td>projects</td>
                  <td>Synchronized landing page specs and interactive terminal preview</td>
                </tr>
                <tr>
                  <td><code>2026-10-12 11:15:00</code></td>
                  <td><span class="stack-pill" style="color: #a78bfa; border-color: rgba(167,139,250,0.3); font-size: 0.72rem;">AUTH</span></td>
                  <td>Session</td>
                  <td>reymartchua</td>
                  <td>Master authorization active for @reymartchua</td>
                </tr>
                <tr>
                  <td><code>2026-10-12 10:45:00</code></td>
                  <td><span class="stack-pill" style="color: #38bdf8; border-color: rgba(56,189,248,0.3); font-size: 0.72rem;">SCHEMA</span></td>
                  <td>Database</td>
                  <td>schema.sql</td>
                  <td>Cloudflare D1 tables verified and indexed</td>
                </tr>
              </tbody>
            </table>
          </div>
        `;
      } else if (currentView === 'security') {
        const savedSession = JSON.parse(localStorage.getItem('ragetech_session') || '{}');
        const adminUser = savedSession.user || {};
        main.innerHTML = `
          <div class="dash-header-row">
            <div>
              <h1 class="dash-title">Security & Access Key Management</h1>
              <p class="dash-subtitle">Update your master administrative credentials. Passwords are saved using standard SHA-256 cryptographic hashing.</p>
            </div>
          </div>

          <div class="spotlight-card" style="padding: 32px; max-width: 540px;">
            <div id="adminSecurityAlert" style="display: none; padding: 12px 16px; border-radius: var(--radius-md); font-size: 0.84rem; margin-bottom: 20px;"></div>

            <form onsubmit="handleAdminUpdatePassword(event)" id="adminPassForm">
              <div class="form-group">
                <label class="form-label" for="adminCurrPass">Current Access Key (Optional for verification)</label>
                <input type="password" id="adminCurrPass" class="form-input" placeholder="Enter current password if set" autocomplete="current-password">
                <div style="font-size: 0.72rem; color: var(--text-muted); margin-top: 4px;">Default access key is <code>yuichirokanade</code> for Reymart (or <code>admin123</code>).</div>
              </div>

              <div class="form-group" style="margin-top: 16px;">
                <label class="form-label" for="adminNewPass">New Access Key (Minimum 6 characters)</label>

    async function handleAdminUpdatePassword(e) {
      e.preventDefault();
      const currPassEl = document.getElementById('adminCurrPass');
      const newPassEl = document.getElementById('adminNewPass');
      const confPassEl = document.getElementById('adminConfirmPass');
      const alertBox = document.getElementById('adminSecurityAlert');
      const saveBtn = document.getElementById('adminSavePassBtn');

      const currPass = currPassEl ? currPassEl.value : '';
      const p1 = newPassEl ? newPassEl.value : '';
      const p2 = confPassEl ? confPassEl.value : '';

      function showAlert(msg, isSuccess = false) {
        if (!alertBox) return;
        alertBox.style.display = 'block';
        alertBox.style.background = isSuccess ? 'rgba(16, 185, 129, 0.12)' : 'rgba(239, 68, 68, 0.12)';
        alertBox.style.border = isSuccess ? '1px solid rgba(16, 185, 129, 0.3)' : '1px solid rgba(239, 68, 68, 0.3)';
        alertBox.style.color = isSuccess ? '#34d399' : '#f87171';
        alertBox.textContent = msg;
      }

      if (!p1 || p1.length < 6) {
        showAlert('New access key must be at least 6 characters long.');
        return;
      }

      if (p1 !== p2) {
        showAlert('New passwords do not match. Please verify and re-type.');
        return;
      }

      if (saveBtn) {
        saveBtn.disabled = true;
        saveBtn.innerHTML = `<span>Hashing & Saving...</span>`;
      }

      const session = JSON.parse(localStorage.getItem('ragetech_session') || '{}');
      const adminUser = session.user || { handle: 'reymartchua', email: 'reymartchua@ragetech.dev', id: 'dev-00' };

      try {
        const res = await fetch('/api/auth/change-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            handle: adminUser.handle,
            email: adminUser.email,
            id: adminUser.id,
            currentPassword: currPass,
            newPassword: p1
          })
        });

        const data = await res.json();

        if (currPassEl) currPassEl.value = '';
        if (newPassEl) newPassEl.value = '';
        if (confPassEl) confPassEl.value = '';

        if (res.ok && data.success) {
          showAlert('Access key successfully updated and hashed with SHA-256 in Cloudflare D1!', true);
        } else {
          showAlert(data.error || 'Failed to update access key.');
        }
      } catch (err) {
        showAlert('Network error updating access key. Please verify database connectivity.');
      } finally {
        if (saveBtn) {
          saveBtn.disabled = false;
          saveBtn.innerHTML = `<span>Update & Save Access Key</span>`;
        }
      }
    }

    async function handleAdminAvatarUpload(input) {
      const file = input.files && input.files[0];
      if (!file) return;
      if (!file.type.startsWith('image/')) {
        alert('Please select a valid image file (PNG, JPG, WEBP).');
        return;
      }
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          let w = img.width, h = img.height;
          const maxDim = 400;
          if (w > maxDim || h > maxDim) {
            if (w > h) { h = Math.round((h * maxDim) / w); w = maxDim; }
            else { w = Math.round((w * maxDim) / h); h = maxDim; }
          }
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
          document.getElementById('dAvatar').value = dataUrl;
          document.getElementById('avatarPreview').src = dataUrl;
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
      input.value = '';
    }

    // Save Developer (Cloudflare D1 + LocalStorage Sync)
    async function handleSaveDeveloper(e, id) {
      e.preventDefault();
      const saveBtn = document.getElementById('saveDevBtn');
      if (saveBtn) {
        saveBtn.disabled = true;
        saveBtn.innerHTML = `<span>Saving...</span>`;
      }

      const rawHandle = document.getElementById('dHandle').value.trim().replace(/^@/, '');
      const assigned_projects = Array.from(document.querySelectorAll('input[name="builderAssignedRepo"]:checked')).map(cb => cb.value);
      const passEl = document.getElementById('dPassword');
      const passVal = passEl ? passEl.value : undefined;
      if (passEl) passEl.value = '';
      
      const payload = {
        id: id || `dev-${Date.now()}`,
        name: document.getElementById('dName').value.trim(),
        handle: rawHandle,
        email: document.getElementById('dEmail').value.trim(),
        password: passVal || undefined,
        account_role: document.getElementById('dAccountRole').value,
        role: document.getElementById('dRole').value.trim(),
        assigned_projects,
        bio: document.getElementById('dBio').value.trim(),
        avatar_url: document.getElementById('dAvatar').value.trim(),
        website_url: document.getElementById('dWebsite').value.trim(),
        github_url: document.getElementById('dGithub').value.trim(),
        gpg_fingerprint: document.getElementById('dGpg').value.trim(),
        is_verified: document.getElementById('dVerified').checked ? 1 : 0
      };

      // If new password provided, calculate SHA-256 hash
      if (passVal) {
        if (passVal.length < 6) {
          alert('Password must be at least 6 characters long.');
          if (saveBtn) {
            saveBtn.disabled = false;
            saveBtn.innerHTML = `<span>Save Developer Profile</span>`;
          }
          return;
        }
        try {
          const msgUint8 = new TextEncoder().encode(passVal);
          const hashBuffer = await crypto.subtle.digest('SHA-256', msgUint8);
          const hashArray = Array.from(new Uint8Array(hashBuffer));
          payload.password_hash = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        } catch (e) {}
      } else {
        // Preserve existing password_hash if developer had one
        const existingDev = developersData.find(d => d.id === payload.id || d.handle === payload.handle);
        if (existingDev && existingDev.password_hash) {
          payload.password_hash = existingDev.password_hash;
        }
      }

      // 1. Send to Cloudflare D1
      try {
        const dRes = await fetch('/api/manage/developers', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const dJson = await dRes.json().catch(() => ({}));
        if (!dRes.ok || dJson.success === false) {
          alert('Failed to save developer to database: ' + (dJson.message || `HTTP ${dRes.status}`));
          return;
        }
      } catch (err) {
        alert('Network error connecting to database API: ' + err.message);
        return;
      }

      delete payload.password;

      if (passVal) {
        try {
          await fetch('/api/auth/change-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              handle: payload.handle,
              id: payload.id,
              email: payload.email,
              newPassword: passVal
            })
          });
        } catch (err) {}
      }

      window.RagetechSync?.broadcast({ type: 'DEVELOPER_SAVED', handle: payload.handle, data: payload });

      closeCrudModal();
      renderCurrentView();

      if (passVal) {
        alert(`Access key for @${payload.handle} has been successfully updated and hashed with SHA-256! They can now log in using this access key.`);
      }
    }

      const pass = input ? input.value.trim() : '';
      if (!pass || pass.length < 6) {
        alert('Password must be at least 6 characters.');
        return;
      }
      const btn = document.getElementById('quickSavePassBtn');
      if (btn) {
        btn.disabled = true;
        btn.innerHTML = '<span>Updating D1...</span>';
      }

      const dev = developersData.find(d => d.handle === handle || d.id === handle);
      const devId = dev ? dev.id : handle;

      try {
        const msgUint8 = new TextEncoder().encode(pass);
        const hashBuffer = await crypto.subtle.digest('SHA-256', msgUint8);
        const hashArray = Array.from(new Uint8Array(hashBuffer));
        const newHash = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');

        await fetch('/api/auth/change-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            handle,
            id: devId,
            email: dev ? dev.email : '',
            newPassword: pass
          })
        });

        if (dev) dev.password_hash = newHash;

        window.RagetechSync?.broadcast({ type: 'DEVELOPER_PASSWORD_CHANGED', handle });
        closeCrudModal();
        alert(`Access key for @${handle} updated successfully! New password is: "${pass}"`);
      } catch (err) {
        alert('Error updating password: ' + err.message);
      }
    }

    // Delete Developer (Direct Cloudflare D1)
    async function deleteDeveloper(id) {
      const dev = developersData.find(d => d.id === id || d.handle === id);
      const name = dev ? `${dev.name} (@${dev.handle})` : id;
      if (!confirm(`Are you sure you want to permanently remove ${name} from the collective? This cannot be undone.`)) return;
      
      try {
        const res = await fetch(`/api/manage/developers/${id}`, { method: 'DELETE' });
        const json = await res.json().catch(() => ({}));
        if (!res.ok || json.success === false) {
          alert('Failed to remove developer from database: ' + (json.message || `HTTP ${res.status}`));
          return;
        }
      } catch (e) {
        alert('Network error connecting to database API: ' + e.message);
        return;
      }

      window.RagetechSync?.broadcast({ type: 'DEVELOPER_DELETED', id, handle: dev ? dev.handle : id });
      developersData = developersData.filter(d => d.id !== id && d.handle !== id);
      renderCurrentView();
    }

    // Quick Assignment Modal
    function openAssignmentModal(slug) {
      const proj = projectsData.find(p => p.slug === slug || p.id === slug) || projectsData[0];
      const content = document.getElementById('crudModalContent');
      content.innerHTML = `
        <h3 style="font-size: 1.3rem; font-weight: 800; margin-bottom: 12px;">Assign Developer to ${proj.name}</h3>
        <p style="font-size: 0.84rem; color: var(--text-secondary); margin-bottom: 20px;">Connect an engineer to this project and grant repository maintainer permissions.</p>
        <form onsubmit="handleSaveAssignment(event, '${proj.id || proj.slug}')">
          <div class="form-group">
            <label class="form-label">Select Developer</label>
            <select id="assignDevId" class="form-select">
              ${developersData.map(d => `<option value="${d.id || d.handle}">${d.name} (@${d.handle})</option>`).join('')}
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Contribution Role</label>
            <input type="text" id="assignRole" class="form-input" value="Lead Maintainer" required>
          </div>
          <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 24px;">
            <button type="button" class="btn-secondary" onclick="closeCrudModal()">Cancel</button>
            <button type="submit" class="btn-primary">Save Assignment</button>
          </div>
        </form>
      `;
      const modal = document.getElementById('crudModal');
      modal.classList.add('open');
      modal.setAttribute('aria-hidden', 'false');
    }

    async function handleSaveAssignment(e, projId) {
      e.preventDefault();
      const devId = document.getElementById('assignDevId').value;
      const role = document.getElementById('assignRole').value;

      try {
        await fetch('/api/manage/assignments', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ project_id: projId, developer_id: devId, contribution_role: role })
        });
      } catch (err) {}

      // Update in local data
      const dev = developersData.find(d => d.id === devId || d.handle === devId);
      const proj = projectsData.find(p => p.id === projId || p.slug === projId);
      if (dev && proj) {
        if (!dev.assigned_projects) dev.assigned_projects = [];
        if (!dev.assigned_projects.includes(proj.slug)) dev.assigned_projects.push(proj.slug);

        let handles = proj.assignees || proj.maintainer_handles || [];
        if (!handles.includes(dev.handle)) handles.push(dev.handle);
        proj.assignees = handles;
        proj.maintainer_handles = handles;
      }

      closeCrudModal();
      renderCurrentView();
    }

    // Init
    checkAdminSession();
    loadData();

    // Real-time synchronization across tabs and windows
    if (window.RagetechSync) {
      window.RagetechSync.subscribe(() => {
        loadData();
      });
    }
  </script>
</body>
</html>
