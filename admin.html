<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard — Ragetech Collective</title>
  <meta name="description" content="Central administration console for dynamic projects, landing page showcases, and team developer management.">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%2309090b'/><path d='M13 3L4 16h10l-1 13 15-17h-11l1-9z' fill='%2306b6d4'/></svg>">
  <link rel="stylesheet" href="styles.css?v=20261012-mobile">
  <style>
    .avatar-preset-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 2px solid var(--border-subtle);
      cursor: pointer;
      overflow: hidden;
      transition: all var(--transition-fast);
      padding: 0;
      background: none;
    }
    .avatar-preset-btn:hover {
      border-color: var(--accent-cyan);
      transform: scale(1.1);
    }
    .project-toggle-card {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 12px;
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      background: rgba(255, 255, 255, 0.02);
      cursor: pointer;
      transition: all var(--transition-fast);
      user-select: none;
    }
    .project-toggle-card:hover {
      border-color: rgba(6, 182, 212, 0.4);
      background: rgba(6, 182, 212, 0.05);
    }
    .project-toggle-card.selected {
      border-color: var(--accent-cyan);
      background: rgba(6, 182, 212, 0.12);
    }
    .project-toggle-checkbox {
      accent-color: var(--accent-cyan);
      width: 16px;
      height: 16px;
      cursor: pointer;
    }
    .feature-hint-card {
      background: linear-gradient(135deg, rgba(6, 182, 212, 0.08) 0%, rgba(139, 92, 246, 0.05) 100%);
      border: 1px solid rgba(6, 182, 212, 0.2);
      border-radius: var(--radius-md);
      padding: 16px 20px;
      margin-bottom: 24px;
      display: flex;
      align-items: flex-start;
      gap: 14px;
    }
    .feature-hint-card p {
      margin: 4px 0 0;
      font-size: 0.84rem;
      color: var(--text-secondary);
      line-height: 1.5;
    }
  </style>
</head>
<body class="dashboard-page">

  <div class="ambient-mesh-glow" aria-hidden="true"></div>
  <div class="bg-dot-grid" aria-hidden="true"></div>

  <!-- Top Navigation Header -->
  <header class="site-header">
    <div class="header-glass-bar">
      <div class="brand-wrapper">
        <a href="index.html" class="brand-mark" aria-label="Ragetech Home">
          <div class="brand-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
          </div>
          <span class="brand-name">RAGETECH</span>
        </a>
        <span class="badge-role admin">ADMIN DASHBOARD</span>
      </div>

      <div class="header-actions">
        <a href="index.html" class="btn-secondary" style="font-size: 0.82rem; padding: 6px 14px;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
          <span>View Public Site</span>
        </a>
        <button onclick="handleLogout()" class="btn-secondary" style="font-size: 0.82rem; padding: 6px 14px; color: #f87171; border-color: rgba(239,68,68,0.25);">
          <span>Sign Out</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Dashboard Layout -->
  <div class="dashboard-layout">
    <!-- Sidebar -->
    <aside class="dashboard-sidebar">
      <div class="dashboard-user-card" id="adminUserCard" onclick="openDeveloperModal(currentAdminUser ? currentAdminUser.handle : 'reymartchua')" style="cursor: pointer;" title="Click to customize your admin profile and custom photo">
        <img src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=280&q=80" alt="Admin" class="dashboard-user-avatar" id="adminAvatar" onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=280&q=80';">
        <div class="dashboard-user-info" style="flex: 1; min-width: 0; overflow: hidden;">
          <div style="display: flex; align-items: center; justify-content: space-between; gap: 4px;">
            <div style="font-weight: 700; font-size: 0.90rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;" id="adminName" title="Reymart Chua">Reymart Chua</div>
            <span style="font-size: 0.70rem; color: var(--accent-cyan); flex-shrink: 0;">✎ Edit</span>
          </div>
          <div class="dashboard-user-meta" id="adminEmail" title="reymartchua@ragetech.dev">reymartchua@ragetech.dev</div>
        </div>
      </div>

      <nav class="dashboard-nav-menu">
        <div class="dash-nav-item active" data-view="repos" onclick="switchView('repos')">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
          <span>Projects & Showcase</span>
        </div>
        <div class="dash-nav-item" data-view="builders" onclick="switchView('builders')">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
          <span>Team & Developers</span>
        </div>
        <div class="dash-nav-item" data-view="assignments" onclick="switchView('assignments')">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 11 12 14 22 4"></polyline><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path></svg>
          <span>Project Assignments</span>
        </div>
        <div class="dash-nav-item" data-view="audit" onclick="switchView('audit')">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 14 14"></polyline></svg>
          <span>Activity & Database Log</span>
        </div>
        <div class="dash-nav-item" data-view="security" onclick="switchView('security')">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
          <span>Security & Access Key</span>
        </div>
      </nav>

      <div style="margin-top: auto; padding-top: 20px; border-top: 1px solid var(--border-subtle); font-family: var(--font-mono); font-size: 0.74rem; color: var(--text-muted);">
        <div>Database: Cloudflare D1</div>
        <div style="color: var(--accent-emerald); margin-top: 4px;">● Live Dynamic Synchronization</div>
      </div>
    </aside>

    <!-- Main Workspace -->
    <main class="dashboard-main" id="dashMain">
      <!-- Rendered dynamically -->
    </main>
  </div>

  <!-- Dynamic Modal for Adding / Editing Developers -->
  <div id="crudModal" class="modal-backdrop" aria-hidden="true" inert>
    <div class="modal-dialog" style="max-width: 680px; max-height: 90vh; overflow-y: auto;">
      <button class="modal-close-btn" onclick="closeCrudModal()" aria-label="Close modal">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      </button>
      <div id="crudModalContent"></div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="api-bridge.js?v=20261012-d1"></script>
  <script>
    let currentView = 'repos';
    let projectsData = [];
    let developersData = [];

    let currentAdminUser = null;

    // Session Verification
    function checkAdminSession() {
      const saved = localStorage.getItem('ragetech_session');
      if (!saved) {
        window.location.href = 'index.html';
        return null;
      }
      try {
        const parsed = JSON.parse(saved);
        if (parsed.user.account_role !== 'admin') {
          if (parsed.user.account_role === 'lead') {
            window.location.href = 'lead.html';
          } else {
            window.location.href = 'developer-studio.html';
          }
          return null;
        }
        currentAdminUser = parsed.user;
        const nameEl = document.getElementById('adminName');
        const emailEl = document.getElementById('adminEmail');
        const emailVal = currentAdminUser.email || `@${currentAdminUser.handle}`;
        if (nameEl) {
          nameEl.textContent = currentAdminUser.name;
          nameEl.title = currentAdminUser.name;
        }
        if (emailEl) {
          emailEl.textContent = emailVal;
          emailEl.title = emailVal;
        }
        if (currentAdminUser.avatar_url) document.getElementById('adminAvatar').src = currentAdminUser.avatar_url;

        // Fetch fresh developer record from D1 to ensure live avatar is applied
        fetch(`/api/developers/${currentAdminUser.handle}`).then(r => r.json()).then(json => {
          if (json.success && json.data) {
            currentAdminUser = { ...currentAdminUser, ...json.data };
            localStorage.setItem('ragetech_session', JSON.stringify({ user: currentAdminUser, token: parsed.token }));
            if (nameEl) {
              nameEl.textContent = currentAdminUser.name;
              nameEl.title = currentAdminUser.name;
            }
            if (emailEl) {
              const freshEmail = currentAdminUser.email || `@${currentAdminUser.handle}`;
              emailEl.textContent = freshEmail;
              emailEl.title = freshEmail;
            }
            if (currentAdminUser.avatar_url) document.getElementById('adminAvatar').src = currentAdminUser.avatar_url;
          }
        }).catch(() => {});

        return currentAdminUser;
      } catch (e) {
        window.location.href = 'index.html';
        return null;
      }
    }

    function handleLogout() {
      localStorage.removeItem('ragetech_session');
      window.location.href = 'index.html';
    }

    // Dynamic Data Loader (Direct Cloudflare D1 Database)
    async function loadData() {
      let d1Projects = [];
      let d1Devs = [];

      try {
        const pRes = await fetch('/api/projects');
        if (pRes.ok) {
          const json = await pRes.json();
          if (Array.isArray(json.data)) d1Projects = json.data;
        }
      } catch (e) {
        console.warn('Error fetching /api/projects:', e);
      }

      try {
        const dRes = await fetch('/api/developers');
        if (dRes.ok) {
          const json = await dRes.json();
          if (Array.isArray(json.data)) d1Devs = json.data;
        }
      } catch (e) {
        console.warn('Error fetching /api/developers:', e);
      }

      projectsData = d1Projects;
      developersData = d1Devs;

      if (currentAdminUser && currentAdminUser.handle && d1Devs.length > 0) {
        const freshAdmin = d1Devs.find(d => d.handle.toLowerCase() === currentAdminUser.handle.toLowerCase() || d.id === currentAdminUser.id);
        if (freshAdmin) {
          currentAdminUser = { ...currentAdminUser, ...freshAdmin };
          const savedSession = JSON.parse(localStorage.getItem('ragetech_session') || '{}');
          localStorage.setItem('ragetech_session', JSON.stringify({ ...savedSession, user: currentAdminUser }));
          const nameEl = document.getElementById('adminName');
          const emailEl = document.getElementById('adminEmail');
          const avatarEl = document.getElementById('adminAvatar');
          if (nameEl) {
            nameEl.textContent = currentAdminUser.name;
            nameEl.title = currentAdminUser.name;
          }
          if (emailEl) {
            const freshEmail = currentAdminUser.email || `@${currentAdminUser.handle}`;
            emailEl.textContent = freshEmail;
            emailEl.title = freshEmail;
          }
          if (avatarEl && currentAdminUser.avatar_url) avatarEl.src = currentAdminUser.avatar_url;
        }
      }

      renderCurrentView();
    }

    function switchView(view) {
      currentView = view;
      document.querySelectorAll('.dash-nav-item').forEach(el => {
        el.classList.toggle('active', el.getAttribute('data-view') === view);
      });
      renderCurrentView();
    }

    function renderCurrentView() {
      const main = document.getElementById('dashMain');
      if (!main) return;

      if (currentView === 'repos') {
        main.innerHTML = `
          <div class="dash-header-row">
            <div>
              <h1 class="dash-title">Projects & Landing Page Showcase</h1>
              <p class="dash-subtitle">Manage repositories, customize landing page metrics & code terminal, and edit technical whitepapers.</p>
            </div>
            <a href="repository_editor.html" class="btn-primary">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
              <span>Create New Project</span>
            </a>
          </div>

          <!-- Feature Guidance Banner -->
          <div class="feature-hint-card">
            <div style="font-size: 1.4rem;">✨</div>
            <div>
              <strong style="color: var(--text-primary); font-size: 0.92rem;">Dual-Layer Visual Customization:</strong>
              <p>Every repository has two editable areas: <strong>(1) The Landing Page Showcase</strong> (repo tag, version badge, architectural metrics table, and interactive code preview terminal), and <strong>(2) The Dedicated Dossier Page</strong> (<code>project.html</code> whitepaper, custom action button, and maintainer team). Click <strong>Customize</strong> on any project to edit both with live preview!</p>
            </div>
          </div>

          <div class="data-table-container">
            <table class="data-table" id="reposTable">
              <thead>
                <tr>
                  <th style="width: 44px; text-align: center;" title="Drag to reorder repositories">Order</th>
                  <th>Project Name & Path</th>
                  <th>Version Badge</th>
                  <th>Category</th>
                  <th>Assigned Maintainers</th>
                  <th>Status</th>
                  <th style="text-align: right;">Actions</th>
                </tr>
              </thead>
              <tbody>
                ${projectsData.length === 0 ? `
                  <tr>
                    <td colspan="7" style="text-align: center; padding: 48px 16px; color: var(--text-muted);">
                      <div style="font-size: 1.05rem; font-weight: 600; color: var(--text-secondary); margin-bottom: 6px;">No Projects Registered</div>
                      <div style="font-size: 0.85rem;">Currently 0 repositories exist in Cloudflare D1. Click <strong>Create New Project</strong> to publish a new repository.</div>
                    </td>
                  </tr>
                ` : projectsData.map(p => {
                  const maintainers = p.assignees || p.maintainer_handles || (p.maintainers ? p.maintainers.map(m => m.handle) : []);
                  return `
                    <tr class="draggable-row" draggable="true" data-type="project" data-id="${p.id || p.slug}">
                      <td class="drag-handle-cell">
                        <div class="drag-grip-btn" title="Drag to reorder this repository">
                          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="5" r="1.8"></circle><circle cx="15" cy="5" r="1.8"></circle><circle cx="9" cy="12" r="1.8"></circle><circle cx="15" cy="12" r="1.8"></circle><circle cx="9" cy="19" r="1.8"></circle><circle cx="15" cy="19" r="1.8"></circle></svg>
                        </div>
                      </td>
                      <td>
                        <div style="font-weight: 700; font-size: 0.95rem;">${p.name}</div>
                        <div style="font-family: var(--font-mono); font-size: 0.74rem; color: var(--accent-cyan); margin-top: 2px;">${p.repo || `ragetech/${p.slug}`}</div>
                        <div style="font-size: 0.78rem; color: var(--text-muted); margin-top: 2px;">${p.tagline || ''}</div>
                      </td>
                      <td><span class="stack-pill" style="font-size: 0.72rem; padding: 2px 8px;">${p.badge || 'v0.9.4'}</span></td>
                      <td><span class="stack-pill" style="color: var(--accent-cyan); border-color: rgba(6,182,212,0.3); font-size: 0.75rem;">${p.category || 'Project'}</span></td>
                      <td>
                        <div style="display: flex; gap: 4px; flex-wrap: wrap;">
                          ${maintainers.length > 0 
                            ? maintainers.map(h => `<span class="stack-pill" style="font-size: 0.68rem; padding: 2px 6px;">@${h}</span>`).join('') 
                            : '<span style="font-size: 0.72rem; color: var(--text-muted);">None</span>'}
                        </div>
                      </td>
                      <td><span class="verified-icon-chip" style="font-size: 0.72rem;">${(p.status || 'ACTIVE').toUpperCase()}</span></td>
                      <td>
                        <div class="table-actions" style="justify-content: flex-end;">
                          <button class="btn-primary" style="font-size: 0.75rem; padding: 4px 10px;" onclick="openQuickProjectModal('${p.slug}')" title="Quick Edit Metadata & Slug">
                            Edit
                          </button>
                          <a href="repository_editor.html?id=${p.slug}" class="btn-secondary" style="font-size: 0.75rem; padding: 4px 10px; text-decoration: none;" title="Open Visual Customizer">
                            Studio
                          </a>
                          <a href="project.html?id=${p.slug}" target="_blank" class="btn-secondary" style="font-size: 0.75rem; padding: 4px 8px; text-decoration: none;" title="View Public Page">
                            View
                          </a>
                          <button class="btn-icon-action danger" style="padding: 4px 8px;" onclick="deleteProject('${p.id || p.slug}')" title="Delete Repository">
                            Delete
                          </button>
                        </div>
                      </td>
                    </tr>
                  `;
                }).join('')}
              </tbody>
            </table>
          </div>
        `;
      } else if (currentView === 'builders') {
        main.innerHTML = `
          <div class="dash-header-row">
            <div>
              <h1 class="dash-title">Team & Developers Directory</h1>
              <p class="dash-subtitle">Create, customize, and manage developer profiles, engineering job titles, bios, profile links, and assigned repositories.</p>
            </div>
            <button class="btn-primary" onclick="openDeveloperModal()">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
              <span>Add New Developer</span>
            </button>
          </div>

          <div class="data-table-container">
            <table class="data-table" id="buildersTable">
              <thead>
                <tr>
                  <th style="width: 44px; text-align: center;" title="Drag to reorder developers">Order</th>
                  <th style="min-width: 170px;">Developer Profile</th>
                  <th style="min-width: 170px;">Engineering Title</th>
                  <th style="min-width: 120px;">Assigned Repos</th>
                  <th style="min-width: 110px;">Role</th>
                  <th style="min-width: 80px;">Status</th>
                  <th style="min-width: 180px; text-align: right;">Actions</th>
                </tr>
              </thead>
              <tbody>
                ${developersData.map(d => `
                  <tr class="draggable-row" draggable="true" data-type="developer" data-id="${d.id || d.handle}">
                    <td class="drag-handle-cell">
                      <div class="drag-grip-btn" title="Drag to reorder this developer">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="5" r="1.8"></circle><circle cx="15" cy="5" r="1.8"></circle><circle cx="9" cy="12" r="1.8"></circle><circle cx="15" cy="12" r="1.8"></circle><circle cx="9" cy="19" r="1.8"></circle><circle cx="15" cy="19" r="1.8"></circle></svg>
                      </div>
                    </td>
                    <td>
                      <div style="display: flex; align-items: center; gap: 10px;">
                        <img src="${d.avatar_url}" style="width: 34px; height: 34px; border-radius: 50%; object-fit: cover; border: 1px solid var(--border-subtle); flex-shrink: 0;" alt="${d.name}">
                        <div style="min-width: 0; overflow: hidden;">
                          <div style="font-weight: 700; font-size: 0.88rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 130px;" title="${d.name}">${d.name}</div>
                          <div style="font-family: var(--font-mono); font-size: 0.72rem; color: var(--accent-cyan); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 130px;">@${d.handle}</div>
                          <div style="font-size: 0.70rem; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 130px;" title="${d.email || ''}">${d.email || 'No email set'}</div>
                        </div>
                      </div>
                    </td>
                    <td>
                      <div style="font-weight: 600; font-size: 0.84rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 180px;" title="${d.role}">${d.role}</div>
                      <div style="font-size: 0.72rem; color: var(--text-muted); max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;" title="${d.bio || ''}">${d.bio || ''}</div>
                    </td>
                    <td>
                      <div style="display: flex; gap: 4px; flex-wrap: wrap; max-width: 140px;">
                        ${(d.assigned_projects && d.assigned_projects.length > 0)
                          ? d.assigned_projects.map(slug => `<span class="stack-pill" style="font-size: 0.68rem; padding: 2px 7px; color: var(--accent-cyan); border-color: rgba(6,182,212,0.3);">${slug}</span>`).join('')
                          : '<span style="font-size: 0.72rem; color: var(--text-muted);">Core Platform</span>'}
                      </div>
                    </td>
                    <td>
                      <span class="badge-role ${d.account_role || 'developer'}" style="font-size: 0.68rem; padding: 3px 8px; white-space: nowrap;">
                        ${(d.account_role === 'admin' ? 'Administrator' : (d.account_role === 'lead' ? 'Project Lead' : 'Developer')).toUpperCase()}
                      </span>
                    </td>
                    <td style="white-space: nowrap;">
                      ${d.is_verified 
                        ? '<span style="color: var(--accent-emerald); font-weight: 600; font-size: 0.78rem; display: inline-flex; align-items: center; gap: 3px;">✓ Verified</span>' 
                        : '<span style="color: var(--text-muted); font-size: 0.78rem;">Standard</span>'}
                    </td>
                    <td>
                      <div class="table-actions" style="justify-content: flex-end;">
                        <button class="btn-primary" style="font-size: 0.75rem; padding: 4px 10px;" onclick="openDeveloperModal('${d.handle}')" title="Edit Profile">Edit</button>
                        <button class="btn-secondary" style="font-size: 0.75rem; padding: 4px 8px;" onclick="openQuickPasswordModal('${d.handle}')" title="Reset Developer Access Key">Key</button>
                        <a href="developer.html?id=${d.handle}" target="_blank" class="btn-secondary" style="font-size: 0.75rem; padding: 4px 8px; text-decoration: none;" title="View Dossier">View</a>
                        <button class="btn-icon-action danger" style="padding: 4px 8px;" onclick="deleteDeveloper('${d.id || d.handle}')" title="Remove Developer">Delete</button>
                      </div>
                    </td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        `;
      } else if (currentView === 'assignments') {
        main.innerHTML = `

    function showToast(msg) {
      let toast = document.getElementById('dashboardToast');
      if (!toast) {

        toast.style.cssText = 'position: fixed; bottom: 24px; right: 24px; z-index: 9999; background: rgba(9, 9, 11, 0.95); border: 1px solid var(--accent-cyan); color: var(--text-primary); padding: 10px 18px; border-radius: var(--radius-md); font-size: 0.82rem; font-weight: 600; box-shadow: 0 10px 25px rgba(0,0,0,0.5); backdrop-filter: blur(12px); transition: all 0.25s ease; opacity: 0; transform: translateY(10px); pointer-events: none;';
        document.body.appendChild(toast);
      }
      toast.textContent = msg;
      toast.style.opacity = '1';
      toast.style.transform = 'translateY(0)';
      clearTimeout(toast._timeout);
      toast._timeout = setTimeout(() => {
        toast.style.opacity = '0';

      }, 2500);

    function initTableDragAndDrop(tableSelector, type, onReorderCallback) {
      const table = document.querySelector(tableSelector);
      if (!table) return;
      const tbody = table.querySelector('tbody');
      if (!tbody) return;

      let draggedRow = null;

      tbody.querySelectorAll('tr.draggable-row').forEach(row => {
        row.addEventListener('dragstart', (e) => {
          draggedRow = row;
          row.classList.add('is-dragging');
          e.dataTransfer.effectAllowed = 'move';
          e.dataTransfer.setData('text/plain', row.getAttribute('data-id'));
        });

        row.addEventListener('dragend', () => {
          if (draggedRow) draggedRow.classList.remove('is-dragging');
          tbody.querySelectorAll('tr.draggable-row').forEach(r => {
            r.classList.remove('drag-over-top', 'drag-over-bottom');
          });
          draggedRow = null;
        });

        row.addEventListener('dragover', (e) => {
          e.preventDefault();
          if (!draggedRow || draggedRow === row) return;
          e.dataTransfer.dropEffect = 'move';
          const rect = row.getBoundingClientRect();
          const midY = rect.top + rect.height / 2;
          if (e.clientY < midY) {
            row.classList.add('drag-over-top');
            row.classList.remove('drag-over-bottom');
          } else {
            row.classList.add('drag-over-bottom');
            row.classList.remove('drag-over-top');
          }
        });

        row.addEventListener('dragleave', () => {
          row.classList.remove('drag-over-top', 'drag-over-bottom');
        });

        row.addEventListener('drop', async (e) => {
          e.preventDefault();
          if (!draggedRow || draggedRow === row) return;
          const rect = row.getBoundingClientRect();
          const midY = rect.top + rect.height / 2;
          if (e.clientY < midY) {
            tbody.insertBefore(draggedRow, row);
          } else {
            tbody.insertBefore(draggedRow, row.nextSibling);
          }
          row.classList.remove('drag-over-top', 'drag-over-bottom');

          const newOrder = Array.from(tbody.querySelectorAll('tr.draggable-row')).map(r => r.getAttribute('data-id'));
          if (typeof onReorderCallback === 'function') {
            await onReorderCallback(newOrder);
          }
        });
      });
    }

        if (item) reordered.push(item);

    async function handleSaveQuickProject(e, targetId) {
      e.preventDefault();
      const saveBtn = document.getElementById('saveQuickProjBtn');
      if (saveBtn) {
        saveBtn.disabled = true;
        saveBtn.innerHTML = `<span>Saving...</span>`;
      }

      const p = projectsData.find(item => item.id === targetId || item.slug === targetId) || {};
      const newSlug = document.getElementById('qpSlug').value.trim().toLowerCase().replace(/[^a-z0-9_-]+/g, '-').replace(/(^-|-$)/g, '');
      const newName = document.getElementById('qpName').value.trim();
      const newRepo = document.getElementById('qpRepo').value.trim();
      const newBadge = document.getElementById('qpBadge').value.trim();
      const newCat = document.getElementById('qpCategory').value;
      const newStat = document.getElementById('qpStatus').value;
      const newTag = document.getElementById('qpTagline').value.trim();
      const newTech = document.getElementById('qpTechStack').value.trim();

      const payload = {
        ...p,
        id: p.id || targetId,
        slug: newSlug || p.slug,
        name: newName,
        repo: newRepo || `ragetech/${newSlug}`,
        badge: newBadge,
        category: newCat,
        status: newStat,
        tagline: newTag,
        tech_stack: newTech
      };

      try {
        const res = await fetch('/api/manage/projects', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const json = await res.json().catch(() => ({}));
        if (!res.ok || json.success === false) {
          alert('Failed to update project: ' + (json.message || `HTTP ${res.status}`));
          if (saveBtn) { saveBtn.disabled = false; saveBtn.innerHTML = `<span>Save & Sync Database</span>`; }
          return;
        }
      } catch (err) {
        alert('Network error connecting to D1 API: ' + err.message);
        if (saveBtn) { saveBtn.disabled = false; saveBtn.innerHTML = `<span>Save & Sync Database</span>`; }
        return;
      }

      window.RagetechSync?.broadcast({ type: 'PROJECT_SAVED', slug: payload.slug, data: payload });
      closeCrudModal();
      showToast('✓ Project metadata & URL slug saved to D1!');
      await loadData();
    }

    async function handleAdminUpdatePassword(e) {
      e.preventDefault();
      const currPassEl = document.getElementById('adminCurrPass');
      const newPassEl = document.getElementById('adminNewPass');
      const confPassEl = document.getElementById('adminConfirmPass');
      const alertBox = document.getElementById('adminSecurityAlert');
      const saveBtn = document.getElementById('adminSavePassBtn');

      const currPass = currPassEl ? currPassEl.value : '';
      const p1 = newPassEl ? newPassEl.value : '';
      const p2 = confPassEl ? confPassEl.value : '';

      function showAlert(msg, isSuccess = false) {
        if (!alertBox) return;
        alertBox.style.display = 'block';
        alertBox.style.background = isSuccess ? 'rgba(16, 185, 129, 0.12)' : 'rgba(239, 68, 68, 0.12)';
        alertBox.style.border = isSuccess ? '1px solid rgba(16, 185, 129, 0.3)' : '1px solid rgba(239, 68, 68, 0.3)';
        alertBox.style.color = isSuccess ? '#34d399' : '#f87171';
        alertBox.textContent = msg;
      }

      if (!p1 || p1.length < 6) {
        showAlert('New access key must be at least 6 characters long.');
        return;
      }

      if (p1 !== p2) {
        showAlert('New passwords do not match. Please verify and re-type.');
        return;
      }

      if (saveBtn) {
        saveBtn.disabled = true;
        saveBtn.innerHTML = `<span>Hashing & Saving...</span>`;
      }

      const session = JSON.parse(localStorage.getItem('ragetech_session') || '{}');
      const adminUser = session.user || { handle: 'reymartchua', email: 'reymartchua@ragetech.dev', id: 'dev-00' };

      try {
        const res = await fetch('/api/auth/change-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            handle: adminUser.handle,
            email: adminUser.email,
            id: adminUser.id,
            currentPassword: currPass,
            newPassword: p1
          })
        });

        const data = await res.json();

        if (currPassEl) currPassEl.value = '';
        if (newPassEl) newPassEl.value = '';
        if (confPassEl) confPassEl.value = '';

        if (res.ok && data.success) {
          showAlert('Access key successfully updated and hashed with SHA-256 in Cloudflare D1!', true);
        } else {
          showAlert(data.error || 'Failed to update access key.');
        }
      } catch (err) {
        showAlert('Network error updating access key. Please verify database connectivity.');
      } finally {
        if (saveBtn) {
          saveBtn.disabled = false;
          saveBtn.innerHTML = `<span>Update & Save Access Key</span>`;
        }
      }
    }

    function removeTitleInputRow(btn) {
      const container = document.getElementById('titleInputsContainer');
      if (!container) return;
      const rows = container.querySelectorAll('.title-input-row');
      if (rows.length <= 1) {
        const input = rows[0].querySelector('input');
        if (input) {
          input.value = '';
          input.focus();

      const row = btn.closest('.title-input-row');

    async function handleAdminAvatarUpload(input) {
      const file = input.files && input.files[0];
      if (!file) return;
      if (!file.type.startsWith('image/')) {
        alert('Please select a valid image file (PNG, JPG, WEBP).');
        return;
      }
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          let w = img.width, h = img.height;
          const maxDim = 400;
          if (w > maxDim || h > maxDim) {
            if (w > h) { h = Math.round((h * maxDim) / w); w = maxDim; }
            else { w = Math.round((w * maxDim) / h); h = maxDim; }
          }
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
          document.getElementById('dAvatar').value = dataUrl;
          document.getElementById('avatarPreview').src = dataUrl;
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
      input.value = '';
    }

    // Save Developer (Cloudflare D1 + LocalStorage Sync)
    async function handleSaveDeveloper(e, id) {
      e.preventDefault();
      const saveBtn = document.getElementById('saveDevBtn');
      if (saveBtn) {
        saveBtn.disabled = true;
        saveBtn.innerHTML = `<span>Saving...</span>`;
      }

      const rawHandle = document.getElementById('dHandle').value.trim().replace(/^@/, '');
      const assigned_projects = Array.from(document.querySelectorAll('input[name="builderAssignedRepo"]:checked')).map(cb => cb.value);
      const passEl = document.getElementById('dPassword');
      const passVal = passEl ? passEl.value : undefined;
      if (passEl) passEl.value = '';

      const titleInputs = Array.from(document.querySelectorAll('.dev-title-input'));
      const collectedTitles = titleInputs.map(i => i.value.trim()).filter(Boolean);
      const finalRole = collectedTitles.length > 0 ? collectedTitles.join(' & ') : 'Developer';

      const existingDev = developersData.find(d => d.id === id || d.handle === rawHandle);
      const gpgEl = document.getElementById('dGpg');
      const gpg_fingerprint = gpgEl ? gpgEl.value.trim() : (existingDev ? existingDev.gpg_fingerprint || '' : '');
      
      const payload = {
        id: id || `dev-${Date.now()}`,
        name: document.getElementById('dName').value.trim(),
        handle: rawHandle,
        email: document.getElementById('dEmail').value.trim(),
        password: passVal || undefined,
        account_role: document.getElementById('dAccountRole').value,
        role: finalRole,
        assigned_projects,
        bio: document.getElementById('dBio').value.trim(),
        avatar_url: document.getElementById('dAvatar').value.trim(),
        website_url: document.getElementById('dWebsite').value.trim(),
        github_url: document.getElementById('dGithub').value.trim(),
        gpg_fingerprint,
        is_verified: document.getElementById('dVerified').checked ? 1 : 0
      };

      // If new password provided, calculate SHA-256 hash
      if (passVal) {
        if (passVal.length < 6) {
          alert('Password must be at least 6 characters long.');
          if (saveBtn) {
            saveBtn.disabled = false;
            saveBtn.innerHTML = `<span>Save Developer Profile</span>`;
          }
          return;
        }
        try {
          const msgUint8 = new TextEncoder().encode(passVal);
          const hashBuffer = await crypto.subtle.digest('SHA-256', msgUint8);
          const hashArray = Array.from(new Uint8Array(hashBuffer));
          payload.password_hash = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        } catch (e) {}
      } else {
        // Preserve existing password_hash if developer had one
        const existingDev = developersData.find(d => d.id === payload.id || d.handle === payload.handle);
        if (existingDev && existingDev.password_hash) {
          payload.password_hash = existingDev.password_hash;
        }
      }

      // 1. Send to Cloudflare D1
      try {
        const dRes = await fetch('/api/manage/developers', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const dJson = await dRes.json().catch(() => ({}));
        if (!dRes.ok || dJson.success === false) {
          alert('Failed to save developer to database: ' + (dJson.message || `HTTP ${dRes.status}`));
          return;
        }
      } catch (err) {
        alert('Network error connecting to database API: ' + err.message);
        return;
      }

      delete payload.password;

      if (passVal) {
        try {
          await fetch('/api/auth/change-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              handle: payload.handle,
              id: payload.id,
              email: payload.email,
              newPassword: passVal
            })
          });
        } catch (err) {}
      }

      // If saving current logged-in admin, immediately update session & avatar in top user card
      if (currentAdminUser && (payload.handle.toLowerCase() === currentAdminUser.handle.toLowerCase() || payload.id === currentAdminUser.id)) {
        currentAdminUser = { ...currentAdminUser, ...payload };
        const savedSession = JSON.parse(localStorage.getItem('ragetech_session') || '{}');
        localStorage.setItem('ragetech_session', JSON.stringify({ ...savedSession, user: currentAdminUser }));
        document.getElementById('adminName').textContent = currentAdminUser.name;
        if (currentAdminUser.avatar_url) document.getElementById('adminAvatar').src = currentAdminUser.avatar_url;
      }

      window.RagetechSync?.broadcast({ type: 'DEVELOPER_SAVED', handle: payload.handle, data: payload });

      closeCrudModal();
      await loadData();

      if (passVal) {
        alert(`Access key for @${payload.handle} has been successfully updated and hashed with SHA-256! They can now log in using this access key.`);
      }
    }

    // Global Audit State
    let allAuditLogs = [];
    let currentAuditSearch = '';
    let currentAuditEventFilter = 'ALL';
    let currentAuditPage = 1;
    const AUDIT_PAGE_SIZE = 10;

    // Helper: Resolve Actor Full Name, Handle & Avatar
    function getActorInfo(rawActor) {
      const actorStr = String(rawActor || 'system').trim();
      const clean = actorStr.replace(/^@/, '').toLowerCase();

      // 1. Direct match in developersData
      const match = developersData.find(d => 
        (d.handle && d.handle.toLowerCase() === clean) ||
        (d.id && d.id.toLowerCase() === clean) ||
        (d.name && d.name.toLowerCase() === clean)
      );
      if (match) {
        return {
          fullName: match.name,
          handle: match.handle,
          avatar: match.avatar_url
        };
      }

      // 2. Check current logged-in admin user
      if (currentAdminUser) {
        if ((currentAdminUser.handle && currentAdminUser.handle.toLowerCase() === clean) ||
            (currentAdminUser.id && currentAdminUser.id.toLowerCase() === clean)) {
          return {
            fullName: currentAdminUser.name,
            handle: currentAdminUser.handle,
            avatar: currentAdminUser.avatar_url
          };
        }
      }

      // 3. Fallback for 'admin'
      if (clean === 'admin') {
        if (currentAdminUser && currentAdminUser.name) {
          return {
            fullName: currentAdminUser.name,
            handle: currentAdminUser.handle || 'admin',
            avatar: currentAdminUser.avatar_url
          };
        }
        const adminDev = developersData.find(d => d.account_role === 'admin');
        if (adminDev) {
          return {
            fullName: adminDev.name,
            handle: adminDev.handle,
            avatar: adminDev.avatar_url
          };
        }
        return { fullName: 'Administrator', handle: 'admin', avatar: '' };
      }

      if (clean === 'system') {
        return { fullName: 'Automated System', handle: 'system', avatar: '' };
      }

      // 4. Default: Capitalize handle
      const formatted = clean.charAt(0).toUpperCase() + clean.slice(1);
      return { fullName: formatted, handle: clean, avatar: '' };
    }

      const defs = {

    // Helper: Resolve Target to Clear Human-Readable Titles
    function getTargetDisplay(log) {
      const tId = (log.target_id || '').trim();
      const tType = (log.target_type || '').toLowerCase();
      const details = log.details || '';

      // Check Developer match
      if (tType === 'developer' || tId.startsWith('dev-')) {
        const dev = developersData.find(d => 
          d.id === tId || 
          (d.handle && d.handle.toLowerCase() === tId.toLowerCase())
        );
        if (dev) {
          return {
            category: 'Developer',
            title: dev.name,
            meta: `@${dev.handle}`
          };
        }
        const handleMatch = details.match(/@([a-zA-Z0-9_-]+)/);
        if (handleMatch) {
          const h = handleMatch[1].toLowerCase();
          const devByH = developersData.find(d => d.handle && d.handle.toLowerCase() === h);
          if (devByH) {
            return {
              category: 'Developer',
              title: devByH.name,
              meta: `@${devByH.handle}`
            };
          }
          return {
            category: 'Developer',
            title: handleMatch[1],
            meta: `@${handleMatch[1]}`
          };
        }
      }

      // Check Project match
      if (tType === 'project' || tId.startsWith('proj-') || tId.startsWith('p-')) {
        const proj = projectsData.find(p => 
          p.id === tId || 
          p.slug === tId || 
          (p.slug && tId.includes(p.slug))
        );
        if (proj) {
          return {
            category: 'Repository',
            title: proj.name,
            meta: proj.slug
          };
        }
        const repoMatch = details.match(/Repository\s+([^(]+)\s*\(([^)]+)\)/i) || details.match(/Project\s+([^\s]+)/i);
        if (repoMatch) {
          return {
            category: 'Repository',
            title: repoMatch[1].trim(),
            meta: repoMatch[2] ? repoMatch[2].trim() : ''
          };
        }
      }

      // System / Generic
      if (!tId || tId === '-' || tId === 'system' || tType === 'system') {
        return {
          category: 'System',
          title: 'Platform System',
          meta: 'Global Service'
        };
      }

      return {
        category: tType ? (tType.charAt(0).toUpperCase() + tType.slice(1)) : 'Resource',
        title: tId,
        meta: ''
      };
    }

    // Helper: Plain-English, Natural Activity Description
    function getFriendlyDescription(log, actor, target) {
      const act = (log.action || '').toUpperCase();
      const det = log.details || '';

      if (act === 'LOGIN' || act === 'AUTH_LOGIN') {
        return `Signed in to administrative dashboard session.`;
      }
      if (act === 'PROJECT_CREATE') {
        return `Published new repository showcase for ${target.title}.`;
      }
      if (act === 'PROJECT_UPDATE') {
        return `Updated showcase configuration and repository details for ${target.title}.`;
      }
      if (act === 'PROJECT_DELETE') {
        return `Deleted repository ${target.title} and cleared maintainer assignments.`;
      }
      if (act === 'DEVELOPER_CREATE') {
        return `Added ${target.title} to team directory with public dossier.`;
      }
      if (act === 'DEVELOPER_UPDATE') {
        return `Updated bio, job title, and project assignments for ${target.title}.`;
      }
      if (act === 'DEVELOPER_DELETE') {
        return `Removed ${target.title} from team directory and revoked access key.`;
      }
      if (act === 'PASSWORD_CHANGE') {
        return `Updated and secured SHA-256 access key for ${target.title}.`;
      }
      if (act === 'D1 SYNC') {
        return `Synchronized platform records across Cloudflare D1 distributed edge.`;
      }
      if (act === 'SECURITY') {
        return `Updated master security credentials or permissions.`;
      }

      if (det) {
        return det.replace(/saved to D1 database/gi, 'saved successfully')
                  .replace(/saved to D1/gi, 'saved successfully')
                  .replace(/hashed via SHA-256/gi, 'secured with SHA-256')
                  .replace(/from D1/gi, 'from database');
      }

      return 'Administrative event logged successfully.';
    }

    function filterAndRenderAuditLogs() {
      const tbody = document.getElementById('auditTableBody');
      const countBadge = document.getElementById('auditCountBadge');
      const paginationEl = document.getElementById('auditPagination');
      if (!tbody) return;

      if (!allAuditLogs || allAuditLogs.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: var(--text-muted); padding: 32px;">No activity logged yet. Platform events will appear here in real time.</td></tr>`;
        if (countBadge) countBadge.textContent = '0 events';
        if (paginationEl) {
          paginationEl.innerHTML = '';
          paginationEl.style.display = 'none';
        }
        return;
      }

      // Pre-compute resolved metadata for each log item
      const enrichedLogs = allAuditLogs.map(l => {
        const actor = getActorInfo(l.actor_handle);
        const eventDisplay = getEventDisplay(l.action);
        const target = getTargetDisplay(l);
        const description = getFriendlyDescription(l, actor, target);
        const formattedDate = (l.timestamp || '').replace('T', ' ').slice(0, 19);
        return {
          raw: l,
          actor,
          eventDisplay,
          target,
          description,
          formattedDate
        };
      });

      // Filter by Event dropdown
      let filtered = enrichedLogs;
      if (currentAuditEventFilter !== 'ALL') {
        filtered = filtered.filter(item => {
          const act = (item.raw.action || '').toUpperCase();
          if (currentAuditEventFilter === 'PROJECT') return act.startsWith('PROJECT_');
          if (currentAuditEventFilter === 'DEVELOPER') return act.startsWith('DEVELOPER_');
          if (currentAuditEventFilter === 'PASSWORD_CHANGE') return act === 'PASSWORD_CHANGE';
          if (currentAuditEventFilter === 'LOGIN') return act === 'LOGIN' || act === 'AUTH_LOGIN';
          return true;
        });
      }

      // Filter by Search Query
      if (currentAuditSearch) {
        const q = currentAuditSearch;
        filtered = filtered.filter(item => {
          return item.formattedDate.toLowerCase().includes(q) ||
                 item.eventDisplay.label.toLowerCase().includes(q) ||
                 item.actor.fullName.toLowerCase().includes(q) ||
                 item.actor.handle.toLowerCase().includes(q) ||
                 item.target.title.toLowerCase().includes(q) ||
                 (item.target.meta && item.target.meta.toLowerCase().includes(q)) ||
                 item.target.category.toLowerCase().includes(q) ||
                 item.description.toLowerCase().includes(q) ||
                 (item.raw.target_id && item.raw.target_id.toLowerCase().includes(q));
        });
      }

      const totalFiltered = filtered.length;
      const totalPages = Math.max(1, Math.ceil(totalFiltered / AUDIT_PAGE_SIZE));
      if (currentAuditPage > totalPages) currentAuditPage = totalPages;
      if (currentAuditPage < 1) currentAuditPage = 1;

      const startIndex = (currentAuditPage - 1) * AUDIT_PAGE_SIZE;
      const endIndex = Math.min(startIndex + AUDIT_PAGE_SIZE, totalFiltered);

      // Update count badge

            </td>
          </tr>
        `;
        if (paginationEl) {
          paginationEl.innerHTML = '';
          paginationEl.style.display = 'none';
        }
        return;
      }

      // Slice strictly AUDIT_PAGE_SIZE (10) logs for the current page
      const pageLogs = filtered.slice(startIndex, endIndex);

      tbody.innerHTML = pageLogs.map(item => {
        return `
          <tr>

              <div style="font-family: var(--font-mono); font-size: 0.78rem; color: var(--text-secondary); white-space: nowrap;">${item.formattedDate}</div>
            </td>
            <td>
              <span class="stack-pill" style="color: ${item.eventDisplay.color}; border-color: ${item.eventDisplay.border || item.eventDisplay.color + '40'}; background: ${item.eventDisplay.bg || item.eventDisplay.color + '12'}; font-size: 0.72rem; font-weight: 700; white-space: nowrap; display: inline-flex; align-items: center; gap: 4px;">
                <span>${item.eventDisplay.icon || '●'}</span>
                <span>${item.eventDisplay.label}</span>
              </span>
            </td>
            <td>
              <div style="display: flex; align-items: center; gap: 8px;">
                ${item.actor.avatar ? `

                ` : ''}
                <div>
                  <div style="font-weight: 700; font-size: 0.86rem; color: var(--text-primary); white-space: nowrap;">${item.actor.fullName}</div>
                  <div style="font-family: var(--font-mono); font-size: 0.70rem; color: var(--accent-cyan);">@${item.actor.handle}</div>

              <div style="color: #d4d4d8; font-size: 0.84rem; line-height: 1.45;">${item.description}</div>
            </td>
          </tr>
        `;
      }).join('');

      // Render Pagination Controls & Indicators
      if (paginationEl) {
        paginationEl.style.display = 'flex';

        // Compute page numbers list with smart windowing
        const pageButtons = [];
        if (totalPages <= 7) {
          for (let p = 1; p <= totalPages; p++) {
            pageButtons.push(p);
          }
        } else {
          pageButtons.push(1);
          if (currentAuditPage > 3) pageButtons.push('...');
          const start = Math.max(2, currentAuditPage - 1);
          const end = Math.min(totalPages - 1, currentAuditPage + 1);
          for (let p = start; p <= end; p++) {
            if (!pageButtons.includes(p)) pageButtons.push(p);
          }
          if (currentAuditPage < totalPages - 2) pageButtons.push('...');
          if (!pageButtons.includes(totalPages)) pageButtons.push(totalPages);
        }

        const pagesHtml = pageButtons.map(p => {

            return `<span style="color: var(--text-muted); padding: 0 4px; font-size: 0.85rem; user-select: none;">…</span>`;
          }

          return `

            <span style="opacity: 0.4;">•</span>

    async function handleQuickPasswordReset(e, handle) {
      e.preventDefault();
      const input = document.getElementById('quickNewPass');
      const pass = input ? input.value.trim() : '';
      if (!pass || pass.length < 6) {
        alert('Password must be at least 6 characters.');
        return;
      }
      const btn = document.getElementById('quickSavePassBtn');
      if (btn) {
        btn.disabled = true;
        btn.innerHTML = '<span>Updating D1...</span>';
      }

      const dev = developersData.find(d => d.handle === handle || d.id === handle);
      const devId = dev ? dev.id : handle;

      try {
        const msgUint8 = new TextEncoder().encode(pass);
        const hashBuffer = await crypto.subtle.digest('SHA-256', msgUint8);
        const hashArray = Array.from(new Uint8Array(hashBuffer));
        const newHash = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');

        await fetch('/api/auth/change-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            handle,
            id: devId,
            email: dev ? dev.email : '',
            newPassword: pass
          })
        });

        if (dev) dev.password_hash = newHash;

        window.RagetechSync?.broadcast({ type: 'DEVELOPER_PASSWORD_CHANGED', handle });
        closeCrudModal();
        alert(`Access key for @${handle} updated successfully! New password is: "${pass}"`);
      } catch (err) {
        alert('Error updating password: ' + err.message);
      }
    }

    // Delete Developer (Direct Cloudflare D1)
    async function deleteDeveloper(id) {
      const dev = developersData.find(d => d.id === id || d.handle === id);
      const name = dev ? `${dev.name} (@${dev.handle})` : id;
      if (!confirm(`Are you sure you want to permanently remove ${name} from the collective? This cannot be undone.`)) return;
      
      try {
        const res = await fetch(`/api/manage/developers/${id}`, { method: 'DELETE' });
        const json = await res.json().catch(() => ({}));
        if (!res.ok || json.success === false) {
          alert('Failed to remove developer from database: ' + (json.message || `HTTP ${res.status}`));
          return;
        }
      } catch (e) {
        alert('Network error connecting to database API: ' + e.message);
        return;
      }

      window.RagetechSync?.broadcast({ type: 'DEVELOPER_DELETED', id, handle: dev ? dev.handle : id });
      developersData = developersData.filter(d => d.id !== id && d.handle !== id);
      renderCurrentView();
    }

    // Quick Assignment Modal
    function openAssignmentModal(slug) {
      const proj = projectsData.find(p => p.slug === slug || p.id === slug) || projectsData[0];
      const content = document.getElementById('crudModalContent');
      content.innerHTML = `
        <h3 style="font-size: 1.3rem; font-weight: 800; margin-bottom: 12px;">Assign Developer to ${proj.name}</h3>
        <p style="font-size: 0.84rem; color: var(--text-secondary); margin-bottom: 20px;">Connect an engineer to this project and grant repository maintainer permissions.</p>
        <form onsubmit="handleSaveAssignment(event, '${proj.id || proj.slug}')">
          <div class="form-group">
            <label class="form-label">Select Developer</label>
            <select id="assignDevId" class="form-select">
              ${developersData.map(d => `<option value="${d.id || d.handle}">${d.name} (@${d.handle})</option>`).join('')}
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Contribution Role</label>
            <input type="text" id="assignRole" class="form-input" value="Lead Maintainer" required>
          </div>
          <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 24px;">
            <button type="button" class="btn-secondary" onclick="closeCrudModal()">Cancel</button>
            <button type="submit" class="btn-primary">Save Assignment</button>
          </div>
        </form>
      `;
      const modal = document.getElementById('crudModal');
      modal.inert = false;
      modal.classList.add('open');
      modal.setAttribute('aria-hidden', 'false');
    }

    async function handleSaveAssignment(e, projId) {
      e.preventDefault();
      const devId = document.getElementById('assignDevId').value;
      const role = document.getElementById('assignRole').value;

      try {
        await fetch('/api/manage/assignments', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ project_id: projId, developer_id: devId, contribution_role: role })
        });
      } catch (err) {}

      // Update in local data
      const dev = developersData.find(d => d.id === devId || d.handle === devId);
      const proj = projectsData.find(p => p.id === projId || p.slug === projId);
      if (dev && proj) {
        if (!dev.assigned_projects) dev.assigned_projects = [];
        if (!dev.assigned_projects.includes(proj.slug)) dev.assigned_projects.push(proj.slug);

        let handles = proj.assignees || proj.maintainer_handles || [];
        if (!handles.includes(dev.handle)) handles.push(dev.handle);
        proj.assignees = handles;
        proj.maintainer_handles = handles;
      }

      closeCrudModal();
      renderCurrentView();
    }

    // Init
    checkAdminSession();
    loadData();

    // Real-time synchronization across tabs and windows
    if (window.RagetechSync) {
      window.RagetechSync.subscribe(() => {
        loadData();
      });
    }
  </script>
</body>
</html>
