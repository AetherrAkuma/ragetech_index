<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Lead Dashboard — Ragetech Collective</title>
  <meta name="description" content="Lead engineering portal for repository governance, whitepapers, and team assignments.">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%2309090b'/><path d='M13 3L4 16h10l-1 13 15-17h-11l1-9z' fill='%2306b6d4'/></svg>">
  <link rel="stylesheet" href="styles.css?v=20261012-mobile">
</head>
<body class="dashboard-page">

  <div class="ambient-mesh-glow" aria-hidden="true"></div>
  <div class="bg-dot-grid" aria-hidden="true"></div>

  <!-- Header -->
  <header class="site-header">
    <div class="header-glass-bar">
      <div class="brand-wrapper">
        <a href="index.html" class="brand-mark" aria-label="Ragetech Home">
          <div class="brand-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
          </div>
          <span class="brand-name">RAGETECH</span>
        </a>
        <span class="badge-role lead">LEAD PORTAL</span>
      </div>

      <div class="header-actions">
        <a href="index.html" class="btn-secondary" style="font-size: 0.82rem; padding: 6px 14px;">
          <span>Landing Page</span>
        </a>
        <button onclick="handleLogout()" class="btn-secondary" style="font-size: 0.82rem; padding: 6px 14px; color: #f87171; border-color: rgba(239,68,68,0.25);">
          <span>Sign Out</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Dashboard Layout -->
  <div class="dashboard-layout">
    <aside class="dashboard-sidebar">
      <div class="dashboard-user-card" id="leadUserCard" onclick="openLeadProfileModal()" style="cursor: pointer;" title="Click to customize your lead profile and photo">
        <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=280&q=80" alt="Lead" class="dashboard-user-avatar" id="leadAvatar" onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=280&q=80';">
        <div class="dashboard-user-info" style="flex: 1; min-width: 0; overflow: hidden;">
          <div style="display: flex; align-items: center; justify-content: space-between; gap: 4px;">
            <div style="font-weight: 700; font-size: 0.90rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;" id="leadName">Marcus Vance</div>
            <span style="font-size: 0.70rem; color: var(--accent-cyan); flex-shrink: 0;">✎ Edit</span>
          </div>
          <div class="dashboard-user-meta" id="leadRole">Distributed Consensus Lead</div>
        </div>
      </div>

      <nav class="dashboard-nav-menu">
        <div class="dash-nav-item active" data-view="projects" onclick="switchLeadView('projects')">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
          <span>Assigned Repositories</span>
        </div>
        <div class="dash-nav-item" data-view="team" onclick="switchLeadView('team')">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
          <span>Team Maintainers</span>
        </div>
        <div class="dash-nav-item" data-view="security" onclick="switchLeadView('security')">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
          <span>Security & Access Key</span>
        </div>
      </nav>

      <div style="margin-top: auto; padding-top: 20px; border-top: 1px solid var(--border-subtle); font-family: var(--font-mono); font-size: 0.74rem; color: var(--text-muted);">
        <div>Role: Project Lead</div>
        <div style="color: var(--accent-cyan); margin-top: 4px;">● Repository Authority</div>
      </div>
    </aside>

    <main class="dashboard-main" id="leadMain">
      <!-- Rendered dynamically -->
    </main>
  </div>

  <!-- Edit Project / Profile Modal -->
  <div id="leadModal" class="modal-backdrop" aria-hidden="true" inert>
    <div class="modal-dialog" style="max-width: 580px; max-height: 90vh; overflow-y: auto;">
      <button class="modal-close-btn" onclick="closeLeadModal()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      </button>
      <div id="leadModalContent"></div>
    </div>
  </div>

  <script src="api-bridge.js?v=20261012-d1"></script>
  <script>
    let currentLead = null;
    let projectsList = [];
    let developersList = [];

    function checkLeadSession() {
      const saved = localStorage.getItem('ragetech_session');
      if (!saved) {
        window.location.href = 'index.html';
        return;
      }
      try {
        const parsed = JSON.parse(saved);
        currentLead = parsed.user;
        document.getElementById('leadName').textContent = currentLead.name;
        document.getElementById('leadRole').textContent = `@${currentLead.handle} • ${currentLead.role}`;
        if (currentLead.avatar_url) document.getElementById('leadAvatar').src = currentLead.avatar_url;

        // Fetch fresh developer record from D1 to ensure live avatar is applied
        fetch(`/api/developers/${currentLead.handle}`).then(r => r.json()).then(json => {
          if (json.success && json.data) {
            currentLead = { ...currentLead, ...json.data };
            localStorage.setItem('ragetech_session', JSON.stringify({ user: currentLead, token: parsed.token }));
            document.getElementById('leadName').textContent = currentLead.name;
            document.getElementById('leadRole').textContent = `@${currentLead.handle} • ${currentLead.role}`;
            if (currentLead.avatar_url) document.getElementById('leadAvatar').src = currentLead.avatar_url;
          }
        }).catch(() => {});
      } catch (e) {
        window.location.href = 'index.html';
      }
    }

    function handleLogout() {
      localStorage.removeItem('ragetech_session');
      window.location.href = 'index.html';
    }

    async function loadLeadData() {
      let d1Projects = [];
      let d1Devs = [];

      try {
        const pRes = await fetch('/api/projects');
        if (pRes.ok) {
          const json = await pRes.json();
          if (Array.isArray(json.data)) d1Projects = json.data;
        }
      } catch (e) {
        console.warn('Error fetching /api/projects:', e);
      }

      try {
        const dRes = await fetch('/api/developers');
        if (dRes.ok) {
          const json = await dRes.json();
          if (Array.isArray(json.data)) d1Devs = json.data;
        }
      } catch (e) {
        console.warn('Error fetching /api/developers:', e);
      }

      projectsList = d1Projects;
      developersList = d1Devs;

      if (currentLead && currentLead.handle && d1Devs.length > 0) {
        const freshLead = d1Devs.find(d => d.handle.toLowerCase() === currentLead.handle.toLowerCase() || d.id === currentLead.id);
        if (freshLead) {
          currentLead = { ...currentLead, ...freshLead };
          const savedSession = JSON.parse(localStorage.getItem('ragetech_session') || '{}');
          localStorage.setItem('ragetech_session', JSON.stringify({ ...savedSession, user: currentLead }));
          const nameEl = document.getElementById('leadName');
          const roleEl = document.getElementById('leadRole');
          const avatarEl = document.getElementById('leadAvatar');
          if (nameEl) nameEl.textContent = currentLead.name;
          if (roleEl) roleEl.textContent = `@${currentLead.handle} • ${currentLead.role}`;
          if (avatarEl && currentLead.avatar_url) avatarEl.src = currentLead.avatar_url;
        }
      }

      renderLeadProjects();
    }

    function switchLeadView(view) {
      document.querySelectorAll('.dash-nav-item').forEach(el => {
        el.classList.toggle('active', el.getAttribute('data-view') === view);
      });
      if (view === 'projects') renderLeadProjects();
      if (view === 'team') renderLeadTeam();
      if (view === 'security') renderLeadSecurity();
    }

    function renderLeadProjects() {
      const main = document.getElementById('leadMain');
      const leadHandle = currentLead ? currentLead.handle : '';
      const leadAssigned = (currentLead && currentLead.assigned_projects) ? currentLead.assigned_projects : [];

      // Strict Lead Scoping: Leads only see and edit repositories assigned to them or created by them
      const visibleProjects = projectsList.filter(p => {
        return (p.maintainer_handles || []).includes(leadHandle) ||
               (p.assignees || []).includes(leadHandle) ||
               (p.maintainers && p.maintainers.some(m => m.handle === leadHandle)) ||
               leadAssigned.includes(p.slug) ||
               leadAssigned.includes(p.id) ||
               p.created_by === leadHandle;
      });

      main.innerHTML = `
        <div class="dash-header-row">
          <div>
            <h1 class="dash-title">Assigned Projects Governance</h1>
            <p class="dash-subtitle">Manage specifications, live links, and whitepapers for projects under your lead.</p>
          </div>
          <a href="repository_editor.html" class="btn-primary">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            <span>Create New Project</span>
          </a>
        </div>

        ${visibleProjects.length === 0 ? `
          <div class="spotlight-card" style="padding: 40px 24px; text-align: center; max-width: 600px; margin: 40px auto;">
            <div style="font-size: 2.2rem; margin-bottom: 12px;">📁</div>
            <div style="font-weight: 800; font-size: 1.15rem; margin-bottom: 8px;">No Repositories Assigned Yet</div>
            <p style="color: var(--text-muted); font-size: 0.88rem; line-height: 1.5; margin: 0 auto 20px;">
              You do not currently have any repositories assigned to <code>@${leadHandle}</code>. As a Project Lead, you have authority to launch new repositories.
            </p>
            <a href="repository_editor.html" class="btn-primary" style="display: inline-flex; align-items: center; gap: 6px;">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
              <span>Create New Project</span>
            </a>
          </div>
        ` : `
          <div class="data-table-container">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Project Name & Description</th>
                  <th>Category</th>
                  <th>Live Website</th>
                  <th>Maintainers</th>
                  <th style="text-align: right;">Actions</th>
                </tr>
              </thead>
              <tbody>
                ${visibleProjects.map(p => `
                  <tr>
                    <td>
                      <div style="font-weight: 700; font-size: 0.95rem;">${p.name}</div>
                      <div style="font-family: var(--font-mono); font-size: 0.72rem; color: var(--accent-cyan); margin-top: 2px;">${p.repo || `ragetech/${p.slug}`}</div>
                      <div style="font-size: 0.78rem; color: var(--text-muted); margin-top: 2px;">${p.tagline || ''}</div>
                    </td>
                    <td><span class="stack-pill" style="color: var(--accent-cyan); border-color: rgba(6,182,212,0.3); font-size: 0.75rem;">${p.category || 'Project'}</span></td>
                    <td>
                      ${p.live_url ? `<a href="${p.live_url}" target="_blank" style="color: var(--accent-cyan); text-decoration: underline; font-size: 0.82rem;">${p.live_url.replace('https://', '')}</a>` : '<span style="color: var(--text-muted); font-size: 0.8rem;">None</span>'}
                    </td>
                    <td>
                      <div style="display: flex; gap: 4px; flex-wrap: wrap;">
                        ${(p.maintainer_handles || p.assignees || []).map(h => `<span class="stack-pill" style="font-size: 0.72rem;">@${h}</span>`).join('') || '<span style="color: var(--text-muted); font-size: 0.76rem;">None</span>'}
                      </div>
                    </td>
                    <td>
                      <div class="table-actions" style="justify-content: flex-end;">
                        <button onclick="openLeadEditModal('${p.slug}')" class="btn-primary" style="padding: 4px 10px; font-size: 0.75rem;" title="Quick Edit Metadata & Slug">Edit</button>
                        <a href="repository_editor.html?id=${p.slug}" class="btn-secondary" style="padding: 4px 8px; font-size: 0.75rem; text-decoration: none;" title="Edit in Studio">Studio</a>
                        <a href="project.html?id=${p.slug}" target="_blank" class="btn-secondary" style="padding: 4px 8px; font-size: 0.75rem; text-decoration: none;" title="View Project Page">View</a>
                        <button onclick="deleteLeadProject('${p.id || p.slug}')" class="btn-icon-action danger" style="padding: 4px 8px; font-size: 0.75rem;" title="Delete Assigned Repository">Delete</button>
                      </div>
                    </td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        `}
      `;
    }

    function renderLeadTeam() {
      const main = document.getElementById('leadMain');
      main.innerHTML = `
        <div class="dash-header-row">
          <div>
            <h1 class="dash-title">Engineering Maintainers Team</h1>
            <p class="dash-subtitle">Collaborating engineers across systems, edge, compilers, and security.</p>
          </div>
        </div>

        <div class="data-table-container">
          <table class="data-table">
            <thead>
              <tr>
                <th>Maintainer</th>
                <th>Role & Assigned Projects</th>
                <th>Fingerprint</th>
                <th>Profile</th>
              </tr>
            </thead>
            <tbody>
              ${developersList.slice(0, 15).map(d => `
                <tr>
                  <td>
                    <div style="display: flex; align-items: center; gap: 8px;">
                      <img src="${d.avatar_url}" style="width: 28px; height: 28px; border-radius: 50%; object-fit: cover;">
                      <span style="font-weight: 600;">${d.name} (@${d.handle})</span>
                    </div>
                  </td>
                  <td>
                    <div style="font-weight: 600;">${d.role}</div>
                    <div style="display: flex; gap: 4px; flex-wrap: wrap; margin-top: 4px;">
                      ${(d.assigned_projects && d.assigned_projects.length > 0)
                        ? d.assigned_projects.map(slug => `<span class="stack-pill" style="font-size: 0.68rem; padding: 2px 6px;">${slug}</span>`).join('')
                        : '<span style="font-size: 0.72rem; color: var(--text-muted);">None</span>'}
                    </div>
                  </td>
                  <td><code>${(d.gpg_fingerprint || '').slice(0, 16)}</code></td>
                  <td><a href="developer.html?id=${d.handle}" class="btn-icon-action">View Dossier</a></td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      `;
    }

    function closeLeadModal() {
      const modal = document.getElementById('leadModal');
      if (modal && modal.contains(document.activeElement)) {
        document.activeElement.blur();
      }
      if (modal) {
        modal.classList.remove('open');
        modal.setAttribute('aria-hidden', 'true');
        modal.inert = true;
      }
    }

    function openLeadEditModal(slug) {
      const proj = projectsList.find(p => p.slug === slug);
      if (!proj) return;

      const content = document.getElementById('leadModalContent');
      content.innerHTML = `
        <h3 style="font-size: 1.3rem; font-weight: 800; margin-bottom: 20px;">Edit Specification: ${proj.name}</h3>
        <form onsubmit="handleLeadSave(event, '${proj.slug}')">
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px;">
            <div class="form-group">
              <label class="form-label">Project Name</label>
              <input type="text" id="lpName" class="form-input" required value="${proj.name}">
            </div>
            <div class="form-group">
              <label class="form-label">URL Slug (Editable)</label>
              <input type="text" id="lpSlug" class="form-input" required value="${proj.slug}">
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">Project Tagline</label>
            <input type="text" id="lpTagline" class="form-input" required value="${proj.tagline}">
          </div>
          <div class="form-group">
            <label class="form-label">Live Website URL</label>
            <input type="url" id="lpLiveUrl" class="form-input" value="${proj.live_url || ''}">
          </div>
          <div class="form-group">
            <label class="form-label">GitHub URL</label>
            <input type="url" id="lpGithubUrl" class="form-input" value="${proj.github_url || ''}">
          </div>
          <div class="form-group">
            <label class="form-label">Tech Stack</label>
            <input type="text" id="lpStack" class="form-input" value="${proj.tech_stack || ''}">
          </div>
          <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 24px;">
            <button type="button" class="btn-secondary" onclick="closeLeadModal()">Cancel</button>
            <button type="submit" class="btn-primary">Update Blueprint</button>
          </div>
        </form>
      `;

      const modal = document.getElementById('leadModal');
      modal.inert = false;
      modal.classList.add('open');
      modal.setAttribute('aria-hidden', 'false');
    }

    async function handleLeadSave(e, slug) {
      e.preventDefault();
      const proj = projectsList.find(p => p.slug === slug);
      if (proj) {
        const newSlug = document.getElementById('lpSlug').value.trim().toLowerCase().replace(/[^a-z0-9_-]+/g, '-').replace(/(^-|-$)/g, '');
        proj.name = document.getElementById('lpName').value.trim();
        proj.slug = newSlug || proj.slug;
        proj.tagline = document.getElementById('lpTagline').value.trim();
        proj.live_url = document.getElementById('lpLiveUrl').value.trim();
        proj.github_url = document.getElementById('lpGithubUrl').value.trim();
        proj.tech_stack = document.getElementById('lpStack').value.trim();

        try {
          await fetch('/api/manage/projects', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(proj)
          });
        } catch (err) {}

        window.RagetechSync?.broadcast({ type: 'PROJECT_SAVED', slug: proj.slug, data: proj });
        closeLeadModal();
        renderLeadProjects();
      }
    }

    // Lead Profile & Avatar Customizer
    function openLeadProfileModal() {
      if (!currentLead) return;
      const content = document.getElementById('leadModalContent');
      content.innerHTML = `
        <div style="border-bottom: 1px solid var(--border-subtle); padding-bottom: 14px; margin-bottom: 18px;">
          <h3 style="font-size: 1.3rem; font-weight: 800; margin: 0 0 4px;">Customize Lead Profile & Photo</h3>
          <p style="font-size: 0.82rem; color: var(--text-secondary); margin: 0;">Update your name, bio, and custom profile photo stored in Cloudflare D1.</p>
        </div>

        <form onsubmit="handleSaveLeadProfile(event)">
          <div class="form-group">
            <label class="form-label">Full Name</label>
            <input type="text" id="leadEditName" class="form-input" required value="${currentLead.name}">
          </div>

          <div class="form-group">
            <label class="form-label">Developer Alias / Handle</label>
            <div style="position: relative; display: flex; align-items: center;">
              <span style="position: absolute; left: 12px; color: var(--accent-cyan); font-family: var(--font-mono); font-weight: 700;">@</span>
              <input type="text" id="leadEditHandle" class="form-input" style="padding-left: 28px;" required placeholder="e.g. username" value="${currentLead.handle}">
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">Engineering Role / Title</label>
            <input type="text" id="leadEditRole" class="form-input" required value="${currentLead.role}">
          </div>

          <div class="form-group">
            <label class="form-label">Biographical Overview</label>
            <textarea id="leadEditBio" class="form-textarea" rows="3">${currentLead.bio || ''}</textarea>
          </div>

          <div class="form-group">
            <label class="form-label">Profile Photo / Avatar (URL or File Upload)</label>
            <div style="display: flex; gap: 10px; align-items: center; margin-bottom: 8px;">
              <img id="leadAvatarPreview" src="${currentLead.avatar_url || ''}" alt="Avatar Preview" style="width: 44px; height: 44px; border-radius: 50%; object-fit: cover; border: 2px solid var(--accent-cyan); background: #18181b;" onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=280&q=80';">
              <input type="text" id="leadAvatarInput" class="form-input" style="flex: 1;" placeholder="https://... or upload local file" value="${currentLead.avatar_url || ''}" oninput="document.getElementById('leadAvatarPreview').src = this.value">
              <button type="button" class="btn-secondary" style="white-space: nowrap; font-size: 0.8rem; padding: 7px 12px; display: inline-flex; align-items: center; gap: 6px;" onclick="document.getElementById('leadAvatarFileInput').click()">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                <span>Upload File</span>
              </button>
              <input type="file" id="leadAvatarFileInput" accept="image/*" style="display: none;" onchange="handleLeadAvatarUpload(this)">
            </div>
          </div>

          <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 24px; border-top: 1px solid var(--border-subtle); padding-top: 16px;">
            <button type="button" class="btn-secondary" onclick="closeLeadModal()">Cancel</button>
            <button type="submit" class="btn-primary" id="saveLeadProfileBtn">
              <span>Save & Sync Profile</span>
            </button>
          </div>
        </form>
      `;

      const modal = document.getElementById('leadModal');
      modal.inert = false;
      modal.classList.add('open');
      modal.setAttribute('aria-hidden', 'false');
    }

    async function handleLeadAvatarUpload(input) {
      const file = input.files && input.files[0];
      if (!file) return;
      if (!file.type.startsWith('image/')) {
        alert('Please select a valid image file (PNG, JPG, WEBP).');
        return;
      }
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          let w = img.width, h = img.height;
          const maxDim = 400;
          if (w > maxDim || h > maxDim) {
            if (w > h) { h = Math.round((h * maxDim) / w); w = maxDim; }
            else { w = Math.round((w * maxDim) / h); h = maxDim; }
          }
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
          document.getElementById('leadAvatarInput').value = dataUrl;
          document.getElementById('leadAvatarPreview').src = dataUrl;
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
      input.value = '';
    }

    async function handleSaveLeadProfile(e) {
      e.preventDefault();
      const saveBtn = document.getElementById('saveLeadProfileBtn');
      if (saveBtn) {
        saveBtn.disabled = true;
        saveBtn.innerHTML = `<span>Saving...</span>`;
      }

      const rawHandle = document.getElementById('leadEditHandle') ? document.getElementById('leadEditHandle').value.trim().replace(/^@/, '') : currentLead.handle;
      if (rawHandle) currentLead.handle = rawHandle;
      currentLead.name = document.getElementById('leadEditName').value.trim();
      currentLead.role = document.getElementById('leadEditRole').value.trim();
      currentLead.bio = document.getElementById('leadEditBio').value.trim();
      currentLead.avatar_url = document.getElementById('leadAvatarInput').value.trim();

      try {
        const res = await fetch('/api/manage/developers', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(currentLead)
        });
        const json = await res.json().catch(() => ({}));
        if (!res.ok || json.success === false) {
          alert('Failed to save profile: ' + (json.message || `HTTP ${res.status}`));
          if (saveBtn) { saveBtn.disabled = false; saveBtn.innerHTML = `<span>Save & Sync Profile</span>`; }
          return;
        }
      } catch (err) {
        alert('Network error connecting to D1 API: ' + err.message);
        if (saveBtn) { saveBtn.disabled = false; saveBtn.innerHTML = `<span>Save & Sync Profile</span>`; }
        return;
      }

      const savedSession = JSON.parse(localStorage.getItem('ragetech_session') || '{}');
      localStorage.setItem('ragetech_session', JSON.stringify({ ...savedSession, user: currentLead }));

      document.getElementById('leadName').textContent = currentLead.name;
      document.getElementById('leadRole').textContent = `@${currentLead.handle} • ${currentLead.role}`;
      if (currentLead.avatar_url) document.getElementById('leadAvatar').src = currentLead.avatar_url;

      window.RagetechSync?.broadcast({ type: 'DEVELOPER_SAVED', handle: currentLead.handle, data: currentLead });

      closeLeadModal();
      alert('Your project lead profile and photo have been successfully synchronized with Cloudflare D1!');
    }

    // Delete Repository (Strictly restricted to Lead's assigned/created repos)
    async function deleteLeadProject(id) {
      const proj = projectsList.find(p => p.id === id || p.slug === id);
      if (!proj) return;

      const leadHandle = currentLead ? currentLead.handle : '';
      const leadAssigned = (currentLead && currentLead.assigned_projects) ? currentLead.assigned_projects : [];

      const isAssigned = (proj.maintainer_handles || []).includes(leadHandle) ||
                         (proj.assignees || []).includes(leadHandle) ||
                         (proj.maintainers && proj.maintainers.some(m => m.handle === leadHandle)) ||
                         leadAssigned.includes(proj.slug) ||
                         leadAssigned.includes(proj.id) ||
                         proj.created_by === leadHandle;

      if (!isAssigned) {
        alert(`Access Denied: You (@${leadHandle}) can only delete repositories assigned to your lead.`);
        return;
      }

      if (!confirm(`Are you sure you want to permanently delete repository "${proj.name}" (${proj.slug})? This will remove it from the collective catalog.`)) {
        return;
      }

      // 1. D1 API DELETE
      try {
        const targetParam = proj.id || proj.slug;
        const res = await fetch(`/api/manage/projects/${encodeURIComponent(targetParam)}`, { method: 'DELETE' });
        const json = await res.json().catch(() => ({}));
        if (!res.ok || json.success === false) {
          alert('Failed to delete repository from database: ' + (json.message || `HTTP ${res.status}`));
          return;
        }
      } catch (e) {
        alert('Network error connecting to database API: ' + e.message);
        return;
      }

      window.RagetechSync?.broadcast({ type: 'PROJECT_DELETED', id: proj.id, slug: proj.slug });
      projectsList = projectsList.filter(p => p.id !== proj.id && p.slug !== proj.slug);
      renderLeadProjects();

      // 3. Remove from Lead's assigned projects in session if present
      if (currentLead && currentLead.assigned_projects) {
        currentLead.assigned_projects = currentLead.assigned_projects.filter(s => s !== proj.slug && s !== proj.id);
        try {
          const sess = JSON.parse(localStorage.getItem('ragetech_session') || '{}');
          sess.user = currentLead;
          localStorage.setItem('ragetech_session', JSON.stringify(sess));
        } catch (e) {}
      }

      // 4. Update local in-memory list
      projectsList = projectsList.filter(p => p.id !== proj.id && p.slug !== proj.slug);
      renderLeadProjects();
    }

    function renderLeadSecurity() {
      const main = document.getElementById('leadMain');
      main.innerHTML = `
        <div class="dash-header-row">
          <div>
            <h1 class="dash-title">Security & Access Key Management</h1>
            <p class="dash-subtitle">Update your lead credentials. Passwords are saved using standard SHA-256 cryptographic hashing.</p>
          </div>
        </div>

        <div class="spotlight-card" style="padding: 32px; max-width: 540px;">
          <div id="leadSecurityAlert" style="display: none; padding: 12px 16px; border-radius: var(--radius-md); font-size: 0.84rem; margin-bottom: 20px;"></div>

          <form onsubmit="handleLeadUpdatePassword(event)" id="leadPassForm">
            <div class="form-group">
              <label class="form-label" for="leadCurrPass">Current Access Key (Optional for verification)</label>
              <input type="password" id="leadCurrPass" class="form-input" placeholder="Enter current password if set" autocomplete="current-password">
              <div style="font-size: 0.72rem; color: var(--text-muted); margin-top: 4px;">Default access key is <code>admin123</code>.</div>
            </div>

            <div class="form-group" style="margin-top: 16px;">
              <label class="form-label" for="leadNewPass">New Access Key (Minimum 6 characters)</label>
              <input type="password" id="leadNewPass" class="form-input" required minlength="6" placeholder="••••••••••••" autocomplete="new-password">
            </div>

            <div class="form-group" style="margin-top: 16px;">
              <label class="form-label" for="leadConfirmPass">Confirm New Access Key</label>
              <input type="password" id="leadConfirmPass" class="form-input" required minlength="6" placeholder="••••••••••••" autocomplete="new-password">
            </div>

            <div style="display: flex; justify-content: flex-end; margin-top: 24px;">
              <button type="submit" id="leadSavePassBtn" class="btn-primary">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                <span>Generate SHA-256 Hash & Save</span>
              </button>
            </div>
          </form>
        </div>
      `;
    }

    async function handleLeadUpdatePassword(e) {
      e.preventDefault();
      const currPassEl = document.getElementById('leadCurrPass');
      const newPassEl = document.getElementById('leadNewPass');
      const confPassEl = document.getElementById('leadConfirmPass');
      const alertBox = document.getElementById('leadSecurityAlert');
      const saveBtn = document.getElementById('leadSavePassBtn');

      const currPass = currPassEl ? currPassEl.value : '';
      const p1 = newPassEl ? newPassEl.value : '';
      const p2 = confPassEl ? confPassEl.value : '';

      function showAlert(msg, isSuccess = false) {
        if (!alertBox) return;
        alertBox.style.display = 'block';
        alertBox.style.background = isSuccess ? 'rgba(16, 185, 129, 0.12)' : 'rgba(239, 68, 68, 0.12)';
        alertBox.style.border = isSuccess ? '1px solid rgba(16, 185, 129, 0.3)' : '1px solid rgba(239, 68, 68, 0.3)';
        alertBox.style.color = isSuccess ? '#34d399' : '#f87171';
        alertBox.textContent = msg;
      }

      if (!p1 || p1.length < 6) {
        showAlert('New access key must be at least 6 characters long.');
        return;
      }

      if (p1 !== p2) {
        showAlert('New passwords do not match. Please verify and re-type.');
        return;
      }

      if (saveBtn) {
        saveBtn.disabled = true;
        saveBtn.innerHTML = `<span>Hashing & Saving...</span>`;
      }

      const session = JSON.parse(localStorage.getItem('ragetech_session') || '{}');
      const leadUser = session.user || currentLead || {};

      try {
        const res = await fetch('/api/auth/change-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            handle: leadUser.handle,
            email: leadUser.email,
            id: leadUser.id,
            currentPassword: currPass,
            newPassword: p1
          })
        });

        const data = await res.json();

        if (currPassEl) currPassEl.value = '';
        if (newPassEl) newPassEl.value = '';
        if (confPassEl) confPassEl.value = '';

        if (res.ok && data.success) {
          showAlert('Access key successfully updated and hashed with SHA-256 in Cloudflare D1!', true);
        } else {
          showAlert(data.error || 'Failed to update access key.');
        }
      } catch (err) {
        showAlert('Network error updating credentials. Please verify database connectivity.');
      } finally {
        if (saveBtn) {
          saveBtn.disabled = false;
          saveBtn.innerHTML = `<span>Update & Save Access Key</span>`;
        }
      }
    }

    checkLeadSession();
    loadLeadData();

    // Real-time synchronization across tabs and windows
    if (window.RagetechSync) {
      window.RagetechSync.subscribe(() => {
        loadLeadData();
      });
    }
  </script>
