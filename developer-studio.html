<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Developer Studio — Ragetech Collective</title>
  <meta name="description" content="Personal engineering studio for managing developer dossiers, GPG keys, and assigned repositories.">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%2309090b'/><path d='M13 3L4 16h10l-1 13 15-17h-11l1-9z' fill='%2306b6d4'/></svg>">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="dashboard-page">

  <div class="ambient-mesh-glow" aria-hidden="true"></div>
  <div class="bg-dot-grid" aria-hidden="true"></div>

  <!-- Header -->
  <header class="site-header">
    <div class="header-glass-bar">
      <div class="brand-wrapper">
        <a href="index.html" class="brand-mark" aria-label="Ragetech Home">
          <div class="brand-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
          </div>
          <span class="brand-name">RAGETECH</span>
        </a>
        <span class="badge-role developer">DEVELOPER STUDIO</span>
      </div>

      <div class="header-actions">
        <a href="index.html" class="btn-secondary" style="font-size: 0.82rem; padding: 6px 14px;">
          <span>Landing Page</span>
        </a>
        <button onclick="handleLogout()" class="btn-secondary" style="font-size: 0.82rem; padding: 6px 14px; color: #f87171; border-color: rgba(239,68,68,0.25);">
          <span>Sign Out</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Studio Layout -->
  <div class="dashboard-layout">
    <aside class="dashboard-sidebar">
      <div class="dashboard-user-card">
        <img src="" alt="Developer" class="dashboard-user-avatar" id="devAvatar">
        <div style="flex: 1; min-width: 0;">
          <div style="font-weight: 700; font-size: 0.92rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;" id="devName">Developer</div>
          <div style="font-family: var(--font-mono); font-size: 0.74rem; color: var(--accent-cyan);" id="devHandle">@handle</div>
        </div>
      </div>

      <nav class="dashboard-nav-menu">
        <div class="dash-nav-item active" data-view="profile" onclick="switchDevView('profile')">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
          <span>My Dossier Profile</span>
        </div>
        <div class="dash-nav-item" data-view="repos" onclick="switchDevView('repos')">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
          <span>Assigned Repositories</span>
        </div>
        <div class="dash-nav-item" data-view="security" onclick="switchDevView('security')">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
          <span>Security & Key Pass</span>
        </div>
      </nav>

      <div style="margin-top: auto; padding-top: 20px; border-top: 1px solid var(--border-subtle); font-family: var(--font-mono); font-size: 0.74rem; color: var(--text-muted);">
        <div>Status: Verified Builder</div>
        <div style="color: var(--accent-emerald); margin-top: 4px;">● D1 Sync Active</div>
      </div>
    </aside>

    <main class="dashboard-main" id="devMain">
      <!-- Rendered dynamically -->
    </main>
  </div>

  <script src="data/developers.js"></script>
  <script src="data/projects.js"></script>
  <script>
    let currentDev = null;
    let allProjects = [];

    function checkDevSession() {
      const saved = localStorage.getItem('ragetech_session');
      if (!saved) {
        window.location.href = 'index.html';
        return;
      }
      try {
        const parsed = JSON.parse(saved);
        currentDev = parsed.user;
        document.getElementById('devName').textContent = currentDev.name;
        document.getElementById('devHandle').textContent = `@${currentDev.handle}`;
        if (currentDev.avatar_url) document.getElementById('devAvatar').src = currentDev.avatar_url;
      } catch (e) {
        window.location.href = 'index.html';
      }
    }

    function handleLogout() {
      localStorage.removeItem('ragetech_session');
      window.location.href = 'index.html';
    }

    function loadDevData() {
      allProjects = window.RAGETECH_PROJECTS || [];
      renderDevProfile();
    }

    function switchDevView(view) {
      document.querySelectorAll('.dash-nav-item').forEach(el => {
        el.classList.toggle('active', el.getAttribute('data-view') === view);
      });
      if (view === 'profile') renderDevProfile();
      if (view === 'repos') renderDevRepos();
      if (view === 'security') renderDevSecurity();
    }

    function renderDevProfile() {
      const main = document.getElementById('devMain');
      main.innerHTML = `
        <div class="dash-header-row">
          <div>
            <h1 class="dash-title">Developer Dossier Settings</h1>
            <p class="dash-subtitle">Update your public engineering profile, squad specialization, and external links.</p>
          </div>
        </div>

        <div class="spotlight-card" style="padding: 32px; max-width: 680px;">
          <form onsubmit="handleSaveDevProfile(event)">
            <div class="form-group">
              <label class="form-label">Full Name</label>
              <input type="text" id="devFullName" class="form-input" required value="${currentDev.name}">
            </div>
            <div class="form-group">
              <label class="form-label">Engineering Role / Title</label>
              <input type="text" id="devRoleTitle" class="form-input" required value="${currentDev.role}">
            </div>
            <div class="form-group">
              <label class="form-label">Squad Specialization</label>
              <select id="devSquadSelect" class="form-select">
                <option value="systems" ${currentDev.squad === 'systems' ? 'selected' : ''}>Systems</option>
                <option value="edge" ${currentDev.squad === 'edge' ? 'selected' : ''}>Edge</option>
                <option value="compilers" ${currentDev.squad === 'compilers' ? 'selected' : ''}>Compilers</option>
                <option value="security" ${currentDev.squad === 'security' ? 'selected' : ''}>Security</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">Bio / Technical Focus</label>
              <textarea id="devBioInput" class="form-textarea" rows="4" required>${currentDev.bio || ''}</textarea>
            </div>
            <div class="form-group">
              <label class="form-label">Avatar URL</label>
              <input type="url" id="devAvatarInput" class="form-input" value="${currentDev.avatar_url || ''}">
            </div>
            <div class="form-group">
              <label class="form-label">Personal Website URL</label>
              <input type="url" id="devWebsiteInput" class="form-input" value="${currentDev.website_url || ''}">
            </div>
            <div class="form-group">
              <label class="form-label">GitHub Profile URL</label>
              <input type="url" id="devGithubInput" class="form-input" value="${currentDev.github_url || ''}">
            </div>
            <div class="form-group">
              <label class="form-label">Cryptographic GPG Fingerprint</label>
              <input type="text" id="devGpgInput" class="form-input" value="${currentDev.gpg_fingerprint || '8F4A 2B19 E03C 41FA 98E1'}">
            </div>
            <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 24px;">
              <button type="submit" class="btn-primary">Save Changes to D1</button>
            </div>
          </form>
        </div>
      `;
    }

    async function handleSaveDevProfile(e) {
      e.preventDefault();
      currentDev.name = document.getElementById('devFullName').value;
      currentDev.role = document.getElementById('devRoleTitle').value;
      currentDev.squad = document.getElementById('devSquadSelect').value;
      currentDev.bio = document.getElementById('devBioInput').value;
      currentDev.avatar_url = document.getElementById('devAvatarInput').value;
      currentDev.website_url = document.getElementById('devWebsiteInput').value;
      currentDev.github_url = document.getElementById('devGithubInput').value;
      currentDev.gpg_fingerprint = document.getElementById('devGpgInput').value;

      try {
        await fetch('/api/manage/developers', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(currentDev)
        });
      } catch (err) {}

      localStorage.setItem('ragetech_session', JSON.stringify({ user: currentDev, token: `tok_${currentDev.handle}` }));
      document.getElementById('devName').textContent = currentDev.name;
      if (currentDev.avatar_url) document.getElementById('devAvatar').src = currentDev.avatar_url;
      alert('Your dossier profile has been updated!');
    }

    function renderDevRepos() {
      const main = document.getElementById('devMain');
      const assignedSlugs = currentDev.assigned_projects || [];
      const matched = allProjects.filter(p => assignedSlugs.includes(p.slug));

      main.innerHTML = `
        <div class="dash-header-row">
          <div>
            <h1 class="dash-title">My Assigned Repositories</h1>
            <p class="dash-subtitle">Repositories you are actively maintaining and releasing.</p>
          </div>
        </div>

        <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px;">
          ${matched.length > 0 ? matched.map(p => `
            <div class="spotlight-card" style="padding: 24px;">
              <div style="font-weight: 700; font-size: 1.1rem; margin-bottom: 6px;">${p.name}</div>
              <div style="font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 16px;">${p.tagline}</div>
              <div style="display: flex; gap: 8px;">
                <a href="project.html?id=${p.slug}" class="btn-primary" style="padding: 6px 14px; font-size: 0.8rem;">Whitepaper</a>
                ${p.live_url ? `<a href="${p.live_url}" target="_blank" class="btn-secondary" style="padding: 6px 14px; font-size: 0.8rem;">Live Website</a>` : ''}
              </div>
            </div>
          `).join('') : '<p style="color: var(--text-muted);">You are not currently assigned to specific repositories.</p>'}
        </div>
      `;
    }

    function renderDevSecurity() {
      const main = document.getElementById('devMain');
      main.innerHTML = `
        <div class="dash-header-row">
          <div>
            <h1 class="dash-title">Security & Access Key Management</h1>
            <p class="dash-subtitle">Update your credentials. Passwords are saved using standard SHA-256 cryptographic hashing.</p>
          </div>
        </div>

        <div class="spotlight-card" style="padding: 32px; max-width: 500px;">
          <form onsubmit="handleUpdatePassword(event)">
            <div class="form-group">
              <label class="form-label">New Access Key (Password)</label>
              <input type="password" id="newPassInput" class="form-input" required placeholder="••••••••••••">
            </div>
            <div class="form-group">
              <label class="form-label">Confirm New Access Key</label>
              <input type="password" id="confirmPassInput" class="form-input" required placeholder="••••••••••••">
            </div>
            <div style="display: flex; justify-content: flex-end; margin-top: 24px;">
              <button type="submit" class="btn-primary">Generate SHA-256 Hash & Save</button>
            </div>
          </form>
        </div>
      `;
    }

    async function handleUpdatePassword(e) {
      e.preventDefault();
      const p1 = document.getElementById('newPassInput').value;
      const p2 = document.getElementById('confirmPassInput').value;

      if (p1 !== p2) {
        alert('Passwords do not match!');
        return;
      }

      try {
        await fetch('/api/manage/developers', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ ...currentDev, password: p1 })
        });
        alert('Access key successfully updated and hashed with SHA-256 in Cloudflare D1!');
      } catch (e) {
        alert('Updated access key in offline session.');
      }
    }

    checkDevSession();
    loadDevData();
  </script>
</body>
</html>
