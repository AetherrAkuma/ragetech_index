<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Developer Studio — Ragetech Collective</title>
  <meta name="description" content="Personal engineering studio for managing developer dossiers, GPG keys, and assigned repositories.">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%2309090b'/><path d='M13 3L4 16h10l-1 13 15-17h-11l1-9z' fill='%2306b6d4'/></svg>">
  <link rel="stylesheet" href="styles.css?v=20261012-mobile">
</head>
<body class="dashboard-page">

  <div class="ambient-mesh-glow" aria-hidden="true"></div>
  <div class="bg-dot-grid" aria-hidden="true"></div>

  <!-- Header -->
  <header class="site-header">
    <div class="header-glass-bar">
      <div class="brand-wrapper">
        <a href="index.html" class="brand-mark" aria-label="Ragetech Home">
          <div class="brand-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
          </div>
          <span class="brand-name">RAGETECH</span>
        </a>
        <span class="badge-role developer">DEVELOPER STUDIO</span>
      </div>

      <div class="header-actions">
        <a href="index.html" class="btn-secondary" style="font-size: 0.82rem; padding: 6px 14px;">
          <span>Landing Page</span>
        </a>
        <button onclick="handleLogout()" class="btn-secondary" style="font-size: 0.82rem; padding: 6px 14px; color: #f87171; border-color: rgba(239,68,68,0.25);">
          <span>Sign Out</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Studio Layout -->
  <div class="dashboard-layout">
    <aside class="dashboard-sidebar">
      <div class="dashboard-user-card">
        <img src="" alt="Developer" class="dashboard-user-avatar" id="devAvatar">
        <div style="flex: 1; min-width: 0;">
          <div style="font-weight: 700; font-size: 0.92rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;" id="devName">Developer</div>
          <div style="font-family: var(--font-mono); font-size: 0.74rem; color: var(--accent-cyan);" id="devHandle">@handle</div>
        </div>
      </div>

      <nav class="dashboard-nav-menu">
        <div class="dash-nav-item active" data-view="profile" onclick="switchDevView('profile')">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
          <span>My Dossier Profile</span>
        </div>
        <div class="dash-nav-item" data-view="repos" onclick="switchDevView('repos')">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
          <span>Assigned Repositories</span>
        </div>
        <div class="dash-nav-item" data-view="security" onclick="switchDevView('security')">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
          <span>Security & Key Pass</span>
        </div>
      </nav>

      <div style="margin-top: auto; padding-top: 20px; border-top: 1px solid var(--border-subtle); font-family: var(--font-mono); font-size: 0.74rem; color: var(--text-muted);">
        <div>Status: Verified Builder</div>
        <div style="color: var(--accent-emerald); margin-top: 4px;">● D1 Sync Active</div>
      </div>
    </aside>

    <main class="dashboard-main" id="devMain">
      <!-- Rendered dynamically -->
    </main>
  </div>

  <script src="api-bridge.js?v=20261012-d1"></script>
  <script>
    let currentDev = null;
    let allProjects = [];

    function checkDevSession() {
      const saved = localStorage.getItem('ragetech_session');
      if (!saved) {
        window.location.href = 'index.html';
        return;
      }
      try {
        const parsed = JSON.parse(saved);
        currentDev = parsed.user;
        document.getElementById('devName').textContent = currentDev.name;
        document.getElementById('devHandle').textContent = `@${currentDev.handle}`;
        if (currentDev.avatar_url) document.getElementById('devAvatar').src = currentDev.avatar_url;

        // Fetch fresh developer record from D1 to ensure live avatar is applied
        fetch(`/api/developers/${currentDev.handle}`).then(r => r.json()).then(json => {
          if (json.success && json.data) {
            currentDev = { ...currentDev, ...json.data };
            localStorage.setItem('ragetech_session', JSON.stringify({ user: currentDev, token: parsed.token }));
            document.getElementById('devName').textContent = currentDev.name;
            document.getElementById('devHandle').textContent = `@${currentDev.handle}`;
            if (currentDev.avatar_url) document.getElementById('devAvatar').src = currentDev.avatar_url;
            const previewEl = document.getElementById('devAvatarEditPreview');
            if (previewEl && currentDev.avatar_url) previewEl.src = currentDev.avatar_url;
          }
        }).catch(() => {});
      } catch (e) {
        window.location.href = 'index.html';
      }
    }

    function handleLogout() {
      localStorage.removeItem('ragetech_session');
      window.location.href = 'index.html';
    }

    async function loadDevData() {
      let d1Projects = [];
      try {
        const pRes = await fetch('/api/projects');
        if (pRes.ok) {
          const json = await pRes.json();
          if (Array.isArray(json.data)) d1Projects = json.data;
        }
      } catch (e) {
        console.warn('Error loading projects:', e);
      }

      // Also refresh developer profile from D1
      if (currentDev && currentDev.handle) {
        try {
          const dRes = await fetch(`/api/developers/${currentDev.handle}`);
          if (dRes.ok) {
            const dJson = await dRes.json();
            if (dJson.success && dJson.data) {
              currentDev = { ...currentDev, ...dJson.data };
              const saved = JSON.parse(localStorage.getItem('ragetech_session') || '{}');
              localStorage.setItem('ragetech_session', JSON.stringify({ ...saved, user: currentDev }));
              document.getElementById('devName').textContent = currentDev.name;
              if (currentDev.avatar_url) document.getElementById('devAvatar').src = currentDev.avatar_url;
            }
          }
        } catch (e) {}
      }

      allProjects = d1Projects;
      renderDevProfile();
    }

    function switchDevView(view) {
      document.querySelectorAll('.dash-nav-item').forEach(el => {
        el.classList.toggle('active', el.getAttribute('data-view') === view);
      });
      if (view === 'profile') renderDevProfile();
      if (view === 'repos') renderDevRepos();
      if (view === 'security') renderDevSecurity();
    }

    function renderDevProfile() {
      const main = document.getElementById('devMain');
      main.innerHTML = `
        <div class="dash-header-row">
          <div>
            <h1 class="dash-title">Developer Dossier Settings</h1>
            <p class="dash-subtitle">Update your public engineering profile, squad specialization, and external links.</p>
          </div>
        </div>

        <div class="spotlight-card" style="padding: 32px; max-width: 680px;">
          <form onsubmit="handleSaveDevProfile(event)">
            <div class="form-group">
              <label class="form-label">Full Name</label>
              <input type="text" id="devFullName" class="form-input" required value="${currentDev.name}">
            </div>
            <div class="form-group">
              <label class="form-label">Engineering Role / Title</label>
              <input type="text" id="devRoleTitle" class="form-input" required value="${currentDev.role}">
            </div>

            <div class="form-group">
              <label class="form-label">Bio / Technical Focus</label>
              <textarea id="devBioInput" class="form-textarea" rows="4" required>${currentDev.bio || ''}</textarea>
            </div>
            <div class="form-group">
              <label class="form-label">Profile Photo / Avatar (URL or File Upload)</label>
              <div style="display: flex; gap: 10px; align-items: center;">
                <img id="devAvatarEditPreview" src="${currentDev.avatar_url || ''}" alt="Avatar Preview" style="width: 44px; height: 44px; border-radius: 50%; object-fit: cover; border: 2px solid var(--accent-cyan); background: #18181b;">
                <input type="text" id="devAvatarInput" class="form-input" style="flex: 1;" placeholder="https://... or upload local file" value="${currentDev.avatar_url || ''}" oninput="document.getElementById('devAvatarEditPreview').src = this.value">
                <button type="button" class="btn-secondary" style="white-space: nowrap; font-size: 0.8rem; padding: 7px 12px; display: inline-flex; align-items: center; gap: 6px;" onclick="document.getElementById('devAvatarFileInput').click()">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                  <span>Upload Photo</span>
                </button>
                <input type="file" id="devAvatarFileInput" accept="image/*" style="display: none;" onchange="handleDevAvatarUpload(this)">
              </div>
            </div>
            <div class="form-group">
              <label class="form-label">Personal Website URL</label>
              <input type="url" id="devWebsiteInput" class="form-input" value="${currentDev.website_url || ''}">
            </div>
            <div class="form-group">
              <label class="form-label">GitHub Profile URL</label>
              <input type="url" id="devGithubInput" class="form-input" value="${currentDev.github_url || ''}">
            </div>
            <div class="form-group">
              <label class="form-label">Cryptographic GPG Fingerprint</label>
              <input type="text" id="devGpgInput" class="form-input" value="${currentDev.gpg_fingerprint || '8F4A 2B19 E03C 41FA 98E1'}">
            </div>
            <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 24px;">
              <button type="submit" class="btn-primary">Save Changes to D1</button>
            </div>
          </form>
        </div>
      `;
    }

    function processImageFile(file, maxWidth = 500, maxHeight = 500, quality = 0.85) {
      return new Promise((resolve, reject) => {
        if (!file || !file.type.startsWith('image/')) {
          alert('Please select an image file (PNG, JPG, WEBP).');
          return reject(new Error('Invalid image file.'));
        }
        const reader = new FileReader();
        reader.onload = (e) => {
          if (file.type === 'image/svg+xml') {
            resolve(e.target.result);
            return;
          }
          const img = new Image();
          img.onload = () => {
            let w = img.width;
            let h = img.height;
            if (w > maxWidth || h > maxHeight) {
              if (w / maxWidth > h / maxHeight) {
                h = Math.round((h * maxWidth) / w);
                w = maxWidth;
              } else {
                w = Math.round((w * maxHeight) / h);
                h = maxHeight;
              }
            }
            const canvas = document.createElement('canvas');
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL('image/jpeg', quality));
          };
          img.onerror = () => reject(new Error('Failed to load image.'));
          img.src = e.target.result;
        };
        reader.onerror = () => reject(new Error('Failed to read file.'));
        reader.readAsDataURL(file);
      });
    }

    async function handleDevAvatarUpload(input) {
      const file = input.files && input.files[0];
      if (!file) return;
      try {
        const dataUrl = await processImageFile(file, 400, 400, 0.85);
        document.getElementById('devAvatarInput').value = dataUrl;
        document.getElementById('devAvatarEditPreview').src = dataUrl;
        document.getElementById('devAvatar').src = dataUrl;
      } catch (err) {
        console.error('Avatar upload failed:', err);
      } finally {
        input.value = '';
      }
    }

    async function handleSaveDevProfile(e) {
      e.preventDefault();
      currentDev.name = document.getElementById('devFullName').value.trim();
      currentDev.role = document.getElementById('devRoleTitle').value.trim();
      currentDev.bio = document.getElementById('devBioInput').value.trim();
      currentDev.avatar_url = document.getElementById('devAvatarInput').value.trim();
      currentDev.website_url = document.getElementById('devWebsiteInput').value.trim();
      currentDev.github_url = document.getElementById('devGithubInput').value.trim();
      currentDev.gpg_fingerprint = document.getElementById('devGpgInput').value.trim();

      try {
        const res = await fetch('/api/manage/developers', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(currentDev)
        });
        const json = await res.json().catch(() => ({}));
        if (!res.ok || json.success === false) {
          alert('Failed to save dossier to D1: ' + (json.message || `HTTP ${res.status}`));
          return;
        }
      } catch (err) {
        alert('Network error connecting to D1 API: ' + err.message);
        return;
      }

      localStorage.setItem('ragetech_session', JSON.stringify({ user: currentDev, token: `tok_${currentDev.handle}` }));
      document.getElementById('devName').textContent = currentDev.name;
      if (currentDev.avatar_url) document.getElementById('devAvatar').src = currentDev.avatar_url;
      window.RagetechSync?.broadcast({ type: 'DEVELOPER_SAVED', handle: currentDev.handle, data: currentDev });
      alert('Your dossier profile and photo have been updated and synchronized with Cloudflare D1!');
    }

    function renderDevRepos() {
      const main = document.getElementById('devMain');
      const devHandle = currentDev ? currentDev.handle : '';
      const assignedSlugs = (currentDev && currentDev.assigned_projects) ? currentDev.assigned_projects : [];

      // Strict Developer Scoping: Developers can only see and edit repositories assigned to them
      const matched = allProjects.filter(p => {
        return (p.maintainer_handles || []).includes(devHandle) ||
               (p.assignees || []).includes(devHandle) ||
               (p.maintainers && p.maintainers.some(m => m.handle === devHandle)) ||
               assignedSlugs.includes(p.slug) ||
               assignedSlugs.includes(p.id);
      });

      main.innerHTML = `
        <div class="dash-header-row">
          <div>
            <h1 class="dash-title">My Assigned Repositories</h1>
            <p class="dash-subtitle">Repositories you are authorized to maintain, modify, and publish.</p>
          </div>
        </div>

        <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px;">
          ${matched.length > 0 ? matched.map(p => `
            <div class="spotlight-card" style="padding: 24px; display: flex; flex-direction: column;">
              <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px;">
                <div style="font-weight: 700; font-size: 1.1rem;">${p.name}</div>
                <span class="stack-pill" style="font-size: 0.72rem;">${p.badge || 'v0.9'}</span>
              </div>
              <div style="font-family: var(--font-mono); font-size: 0.74rem; color: var(--accent-cyan); margin-bottom: 6px;">${p.repo || `ragetech/${p.slug}`}</div>
              <div style="font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 16px; flex: 1;">${p.tagline || ''}</div>
              <div style="display: flex; gap: 8px; flex-wrap: wrap;">
                <a href="repository_editor.html?id=${p.slug}" class="btn-primary" style="padding: 6px 14px; font-size: 0.8rem; display: inline-flex; align-items: center; gap: 6px; text-decoration: none;">
                  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
                  <span>Edit in Studio</span>
                </a>
                <a href="project.html?id=${p.slug}" class="btn-secondary" style="padding: 6px 14px; font-size: 0.8rem; text-decoration: none;">Dossier</a>
                ${p.live_url ? `<a href="${p.live_url}" target="_blank" class="btn-secondary" style="padding: 6px 14px; font-size: 0.8rem; text-decoration: none;">Live Site</a>` : ''}
              </div>
            </div>
          `).join('') : `
            <div class="spotlight-card" style="padding: 40px 24px; text-align: center; grid-column: 1 / -1;">
              <div style="font-size: 2.2rem; margin-bottom: 10px;">🔒</div>
              <div style="font-weight: 700; font-size: 1.05rem; margin-bottom: 6px;">No Repositories Assigned</div>
              <p style="color: var(--text-muted); font-size: 0.86rem; max-width: 480px; margin: 0 auto; line-height: 1.5;">
                As a standard developer (<code>@${devHandle}</code>), you can only edit repositories assigned to you. Contact an Administrator or Project Lead to be assigned to a repository.
              </p>
            </div>
          `}
        </div>
      `;
    }

    function renderDevSecurity() {
      const main = document.getElementById('devMain');
      main.innerHTML = `
        <div class="dash-header-row">
          <div>
            <h1 class="dash-title">Security & Access Key Management</h1>
            <p class="dash-subtitle">Update your credentials. Passwords are saved using standard SHA-256 cryptographic hashing.</p>
          </div>
        </div>

        <div class="spotlight-card" style="padding: 32px; max-width: 540px;">
          <div id="securityAlertBox" style="display: none; padding: 12px 16px; border-radius: var(--radius-md); font-size: 0.84rem; margin-bottom: 20px;"></div>

          <form onsubmit="handleUpdatePassword(event)" id="changePassForm">
            <div class="form-group">
              <label class="form-label" for="currPassInput">Current Access Key (Optional for verification)</label>
              <input type="password" id="currPassInput" class="form-input" placeholder="Enter current password if set" autocomplete="current-password">
              <div style="font-size: 0.72rem; color: var(--text-muted); margin-top: 4px;">Default access key is <code>admin123</code> (or <code>yuichirokanade</code> for Reymart).</div>
            </div>

            <div class="form-group" style="margin-top: 16px;">
              <label class="form-label" for="newPassInput">New Access Key (Minimum 6 characters)</label>
              <input type="password" id="newPassInput" class="form-input" required minlength="6" placeholder="••••••••••••" autocomplete="new-password">
            </div>

            <div class="form-group" style="margin-top: 16px;">
              <label class="form-label" for="confirmPassInput">Confirm New Access Key</label>
              <input type="password" id="confirmPassInput" class="form-input" required minlength="6" placeholder="••••••••••••" autocomplete="new-password">
            </div>

            <div style="display: flex; justify-content: flex-end; margin-top: 24px;">
              <button type="submit" id="savePassBtn" class="btn-primary">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                <span>Generate SHA-256 Hash & Save</span>
              </button>
            </div>
          </form>
        </div>
      `;
    }

    async function handleUpdatePassword(e) {
      e.preventDefault();
      const currPassEl = document.getElementById('currPassInput');
      const newPassEl = document.getElementById('newPassInput');
      const confPassEl = document.getElementById('confirmPassInput');
      const alertBox = document.getElementById('securityAlertBox');
      const saveBtn = document.getElementById('savePassBtn');

      const currPass = currPassEl ? currPassEl.value : '';
      const p1 = newPassEl ? newPassEl.value : '';
      const p2 = confPassEl ? confPassEl.value : '';

      function showAlert(msg, isSuccess = false) {
        if (!alertBox) return;
        alertBox.style.display = 'block';
        alertBox.style.background = isSuccess ? 'rgba(16, 185, 129, 0.12)' : 'rgba(239, 68, 68, 0.12)';
        alertBox.style.border = isSuccess ? '1px solid rgba(16, 185, 129, 0.3)' : '1px solid rgba(239, 68, 68, 0.3)';
        alertBox.style.color = isSuccess ? '#34d399' : '#f87171';
        alertBox.textContent = msg;
      }

      if (!p1 || p1.length < 6) {
        showAlert('New access key must be at least 6 characters long.');
        return;
      }

      if (p1 !== p2) {
        showAlert('New passwords do not match. Please verify and re-type.');
        return;
      }

      if (saveBtn) {
        saveBtn.disabled = true;
        saveBtn.innerHTML = `<span>Hashing & Saving...</span>`;
      }

      try {
        const res = await fetch('/api/auth/change-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            handle: currentDev.handle,
            email: currentDev.email,
            id: currentDev.id,
            currentPassword: currPass,
            newPassword: p1
          })
        });

        const data = await res.json();

        // Security: clear inputs
        if (currPassEl) currPassEl.value = '';
        if (newPassEl) newPassEl.value = '';
        if (confPassEl) confPassEl.value = '';

        if (res.ok && data.success) {
          showAlert('Access key successfully updated and hashed with SHA-256! You can now log in with your new password.', true);
        } else {
          showAlert(data.error || 'Failed to update access key.');
        }
      } catch (err) {
        showAlert('Network error updating credentials. Please verify database connectivity.');
      } finally {
        if (saveBtn) {
          saveBtn.disabled = false;
          saveBtn.innerHTML = `
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
            <span>Generate SHA-256 Hash & Save</span>
          `;
        }
      }
    }

    checkDevSession();
    loadDevData();

    // Real-time synchronization
    if (window.RagetechSync) {
      window.RagetechSync.subscribe(() => {
        loadDevData();
      });
    }
  </script>
</body>
</html>
